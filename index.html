<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生规划清单 — Life Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b0e;
  --surface: #151419;
  --surface-2: #1c1b22;
  --surface-3: #24232c;
  --border: #2e2d36;
  --accent: #e8a838;
  --accent-dim: #c78d2a;
  --accent-glow: rgba(232,168,56,0.12);
  --green: #3dd68c;
  --green-dim: #2aad6e;
  --red: #e85454;
  --purple: #9b7aed;
  --blue: #5b9cf5;
  --pink: #e87ab4;
  --teal: #3dd6c8;
  --text: #e8e6e1;
  --text-mid: #9d9ba6;
  --text-dim: #5e5c66;
  --font-display: 'Noto Serif SC', serif;
  --font-body: 'Noto Sans SC', sans-serif;
  --font-mono: 'Space Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.app{display:grid;grid-template-columns:260px 1fr 320px;grid-template-rows:auto 1fr;min-height:100vh}

/* HEADER */
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo svg{width:20px;height:20px}
.header-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;letter-spacing:0.04em}
.header-subtitle{font-size:0.73rem;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.header-date{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-mid);padding:6px 14px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.btn-add{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--accent);color:#0c0b0e;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s ease}
.btn-add:hover{background:#f0b848;transform:translateY(-1px)}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 0;overflow-y:auto;height:calc(100vh - 77px);position:sticky;top:77px}
.sidebar-section{padding:0 20px;margin-bottom:28px}
.sidebar-label{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:12px;padding-left:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s ease;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-glow);border:1px solid rgba(232,168,56,0.2)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:box-shadow 0.3s ease}
.nav-item.active .nav-dot{box-shadow:0 0 8px var(--accent)}
.nav-text{font-size:0.88rem;font-weight:400;flex:1}
.nav-count{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-dim);background:var(--surface-3);padding:2px 7px;border-radius:10px}
.nav-sep{height:1px;background:var(--border);margin:12px 20px}
.nav-progress{width:100%;height:3px;background:var(--surface-3);border-radius:2px;margin-top:8px;overflow:hidden}
.nav-progress-bar{height:100%;border-radius:2px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1)}
.sidebar-stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 20px 12px}
.sidebar-stat-label{font-size:0.72rem;color:var(--text-dim);margin-bottom:6px}
.sidebar-stat-value{font-family:var(--font-mono);font-size:1.6rem;font-weight:700;color:var(--accent)}
.sidebar-stat-sub{font-size:0.7rem;color:var(--text-dim);margin-top:4px;font-family:var(--font-mono)}

/* MAIN */
.main{padding:28px 32px;overflow-y:auto;height:calc(100vh - 77px)}
.main-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.main-title{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1.3}
.main-title-sub{font-size:0.82rem;color:var(--text-mid);margin-top:4px}
.main-filters{display:flex;gap:6px}
.filter-btn{padding:5px 14px;font-size:0.75rem;font-family:var(--font-body);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;color:var(--text-mid);cursor:pointer;transition:all 0.2s}
.filter-btn.active,.filter-btn:hover{background:var(--accent-glow);border-color:rgba(232,168,56,0.3);color:var(--accent)}

/* GOAL CARDS */
.goals-list{display:flex;flex-direction:column;gap:16px}
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;transition:all 0.25s ease;animation:slideIn 0.5s ease forwards;opacity:0;position:relative;overflow:hidden}
.goal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 2px 2px 0}
.goal-card:hover{border-color:var(--surface-3);transform:translateX(4px)}
.goal-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.goal-checkbox{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s ease;margin-right:14px;margin-top:2px}
.goal-checkbox:hover{border-color:var(--accent);background:var(--accent-glow)}
.goal-checkbox.checked{background:var(--green);border-color:var(--green)}
.goal-checkbox.checked svg{opacity:1}
.goal-checkbox svg{opacity:0;transition:opacity 0.2s}
.goal-info{flex:1}
.goal-title{font-size:1rem;font-weight:500;line-height:1.5;margin-bottom:4px}
.goal-card.completed .goal-title{text-decoration:line-through;color:var(--text-dim)}
.goal-desc{font-size:0.8rem;color:var(--text-mid);line-height:1.5}
.goal-meta{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.goal-tag{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;padding:3px 10px;border-radius:12px;font-family:var(--font-mono)}
.goal-deadline{font-size:0.72rem;color:var(--text-dim);font-family:var(--font-mono);display:flex;align-items:center;gap:4px}
.goal-progress-wrap{flex:1;min-width:120px}
.goal-progress-bar-bg{width:100%;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.goal-progress-bar-fill{height:100%;border-radius:2px;transition:width 0.8s cubic-bezier(0.22,1,0.36,1)}
.goal-progress-text{font-size:0.68rem;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:3px;text-align:right}
.goal-actions{display:flex;gap:6px;opacity:0;transition:opacity 0.2s}
.goal-card:hover .goal-actions{opacity:1}
.goal-action-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s;color:var(--text-dim)}
.goal-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.goal-action-btn.delete:hover{border-color:var(--red);color:var(--red)}

/* RIGHT PANEL */
.right-panel{background:var(--surface);border-left:1px solid var(--border);padding:24px 20px;overflow-y:auto;height:calc(100vh - 77px);position:sticky;top:77px}
.panel-section{margin-bottom:28px}
.panel-title{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:16px}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.streak-day{aspect-ratio:1;border-radius:4px;background:var(--surface-2);cursor:default;transition:all 0.2s}
.streak-day.filled{background:var(--accent);opacity:0.9}
.streak-day.today{border:1.5px solid var(--accent);box-shadow:0 0 6px rgba(232,168,56,0.3)}
.streak-day:hover{transform:scale(1.15)}
.streak-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.streak-label{text-align:center;font-size:0.6rem;color:var(--text-dim);font-family:var(--font-mono)}
.milestone-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.milestone-item:last-child{border-bottom:none}
.milestone-dot-wrap{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.milestone-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.milestone-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.milestone-content{flex:1}
.milestone-title{font-size:0.82rem;font-weight:500;margin-bottom:2px}
.milestone-date{font-size:0.68rem;color:var(--text-dim);font-family:var(--font-mono)}
.stats-ring-container{display:flex;align-items:center;gap:20px;padding:16px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border)}
.stats-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.stats-ring svg{transform:rotate(-90deg)}
.stats-ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--accent)}
.stats-ring-info{flex:1}
.stats-ring-label{font-size:0.78rem;color:var(--text-mid);margin-bottom:6px}
.stats-ring-breakdown{display:flex;flex-direction:column;gap:4px}
.stats-ring-row{display:flex;align-items:center;gap:6px;font-size:0.7rem}
.stats-ring-row-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.stats-ring-row-text{color:var(--text-mid);flex:1}
.stats-ring-row-val{font-family:var(--font-mono);color:var(--text);font-weight:500}
.quote-card{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.quote-card::before{content:'"';position:absolute;top:-10px;left:12px;font-family:var(--font-display);font-size:5rem;color:var(--accent);opacity:0.08;line-height:1}
.quote-text{font-family:var(--font-display);font-size:0.92rem;font-weight:300;line-height:1.7;color:var(--text-mid);margin-bottom:10px;position:relative;z-index:1}
.quote-author{font-size:0.72rem;color:var(--text-dim);font-family:var(--font-mono)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center;animation:fadeIn 0.3s ease}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:560px;max-width:94vw;max-height:85vh;overflow-y:auto;padding:32px;animation:slideUp 0.35s cubic-bezier(0.22,1,0.36,1)}
.modal-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-bottom:24px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:0.78rem;color:var(--text-mid);margin-bottom:6px;font-weight:500}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-body);font-size:0.88rem;outline:none;transition:border-color 0.2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:72px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-tags{display:flex;flex-wrap:wrap;gap:8px}
.form-tag-option{padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:0.78rem;cursor:pointer;transition:all 0.2s;color:var(--text-mid);background:var(--surface-2)}
.form-tag-option:hover{border-color:var(--text-dim)}
.form-tag-option.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn-cancel{padding:9px 22px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-mid);font-family:var(--font-body);font-size:0.85rem;cursor:pointer;transition:all 0.2s}
.btn-cancel:hover{border-color:var(--text-dim)}
.btn-submit{padding:9px 22px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0c0b0e;font-family:var(--font-body);font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-submit:hover{background:#f0b848}

/* SAVINGS VIEW */
.savings-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.savings-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.savings-stat::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 0 0 60px;opacity:0.06}
.savings-stat-label{font-size:0.72rem;color:var(--text-dim);margin-bottom:8px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.1em}
.savings-stat-value{font-family:var(--font-mono);font-size:1.6rem;font-weight:700}
.savings-stat-sub{font-size:0.7rem;color:var(--text-dim);margin-top:6px}
.savings-goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:28px}
.savings-goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:all 0.25s ease;animation:slideIn 0.5s ease forwards;opacity:0}
.savings-goal-card:hover{border-color:var(--surface-3);transform:translateY(-3px)}
.savings-goal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.savings-goal-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.savings-goal-name{font-size:0.95rem;font-weight:600}
.savings-goal-deadline{font-size:0.68rem;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px}
.savings-goal-amounts{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.savings-goal-current{font-family:var(--font-mono);font-size:1.2rem;font-weight:700}
.savings-goal-target{font-family:var(--font-mono);font-size:0.75rem;color:var(--text-dim)}
.savings-goal-bar{width:100%;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:12px}
.savings-goal-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(0.22,1,0.36,1)}
.savings-goal-monthly{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--text-dim)}
.savings-goal-monthly-val{font-family:var(--font-mono);color:var(--text-mid);font-weight:500}
.savings-goal-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.savings-goal-btn{flex:1;padding:6px;font-size:0.72rem;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-mid);cursor:pointer;transition:all 0.2s;font-family:var(--font-body);text-align:center}
.savings-goal-btn:hover{border-color:var(--accent);color:var(--accent)}
.savings-goal-btn.primary{background:var(--accent-glow);border-color:rgba(232,168,56,0.3);color:var(--accent)}

/* MONTHLY CHART */
.monthly-chart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.monthly-chart-title{font-size:0.92rem;font-weight:600;margin-bottom:4px}
.monthly-chart-sub{font-size:0.72rem;color:var(--text-dim);margin-bottom:20px;font-family:var(--font-mono)}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-bottom:28px;position:relative;border-bottom:1px solid var(--border)}
.chart-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.chart-bar-pair{display:flex;gap:3px;align-items:flex-end;height:130px;width:100%}
.chart-bar{flex:1;border-radius:3px 3px 0 0;transition:height 0.8s cubic-bezier(0.22,1,0.36,1);min-height:2px;position:relative}
.chart-bar:hover{opacity:0.8}
.chart-bar-label{position:absolute;bottom:-24px;font-size:0.6rem;color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap}
.chart-legend{display:flex;gap:16px;margin-top:16px;justify-content:center}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:0.7rem;color:var(--text-mid)}
.chart-legend-dot{width:8px;height:8px;border-radius:2px}

/* MONTHLY PLAN VIEW */
.monthly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-bottom:28px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all 0.2s;cursor:default;animation:slideIn 0.5s ease forwards;opacity:0}
.month-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.month-card.current{border-color:var(--accent);box-shadow:0 0 12px rgba(232,168,56,0.1)}
.month-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.month-card-name{font-family:var(--font-mono);font-size:0.82rem;font-weight:700}
.month-card-status{font-size:0.6rem;padding:2px 8px;border-radius:10px;font-family:var(--font-mono)}
.month-task-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:0.72rem;color:var(--text-mid)}
.month-task-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.month-card-progress{margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.month-card-progress-bar{width:100%;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden;margin-top:6px}
.month-card-progress-fill{height:100%;border-radius:2px;transition:width 0.6s ease}
.month-card-progress-text{display:flex;justify-content:space-between;font-size:0.62rem;color:var(--text-dim);font-family:var(--font-mono)}

/* SMART ADJUST */
.smart-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:28px;position:relative;overflow:hidden}
.smart-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--green),var(--blue))}
.smart-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.smart-panel-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.btn-smart{display:flex;align-items:center;gap:6px;padding:8px 18px;background:linear-gradient(135deg,var(--accent),var(--green));color:#0c0b0e;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.3s}
.btn-smart:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(232,168,56,0.3)}
.smart-results{display:flex;flex-direction:column;gap:12px}
.smart-item{display:flex;gap:14px;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm);border-left:3px solid var(--border);transition:all 0.2s;animation:slideIn 0.4s ease forwards;opacity:0}
.smart-item:hover{background:var(--surface-3)}
.smart-item-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.smart-item-content{flex:1}
.smart-item-title{font-size:0.82rem;font-weight:600;margin-bottom:3px}
.smart-item-msg{font-size:0.75rem;color:var(--text-mid);line-height:1.5}
.smart-item-action{font-size:0.7rem;color:var(--accent);margin-top:4px;cursor:pointer;font-weight:500}
.smart-item-action:hover{text-decoration:underline}
.smart-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}

// ============ STATE ============

let goals, savings, monthlyRecords;
loadData();

// ============ SMART ADJUSTMENT ENGINE ============
function runSmartAdjustment() {
  smartResults = [];
  const now = new Date();
  const cm = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');

  // 1. Analyze active goals
  goals.filter(g => !g.completed).forEach(g => {
    if (!g.deadline) {
      smartResults.push({type:'info',icon:'📌',title:g.title,msg:'未设截止日期，建议设定明确的时间节点以提高完成率。',action:'设定截止日期',actionFn:()=>{alert('请编辑目标设定截止日期');},borderColor:'var(--blue)'});
      return;
    }
    const dl = new Date(g.deadline);
    const cr = new Date(g.created);
    const totalMs = dl - cr;
    const elapsedMs = now - cr;
    const timePct = totalMs > 0 ? Math.min(100, Math.round(elapsedMs / totalMs * 100)) : 100;
    const diff = g.progress - timePct;
    const daysLeft = Math.ceil((dl - now) / 86400000);

    if (diff > 15) {
      smartResults.push({type:'ahead',icon:'🚀',title:g.title,msg:`进度超前 ${diff}%（实际 ${g.progress}% / 时间 ${timePct}%），剩余 ${daysLeft} 天。建议：提高目标难度或提前截止日期。`,action:'加速推进',actionFn:()=>{g.deadline = new Date(now.getTime()+daysLeft*0.5*86400000).toISOString().slice(0,10);saveAll();render();},borderColor:'var(--green)'});
    } else if (diff < -15) {
      const needed = Math.ceil((100 - g.progress) / Math.max(1, daysLeft) * 30);
      smartResults.push({type:'behind',icon:'⚠️',title:g.title,msg:`进度落后 ${Math.abs(diff)}%（实际 ${g.progress}% / 时间 ${timePct}%），剩余 ${daysLeft} 天。建议：每月至少推进 ${needed}%，或将截止日期延长。`,action:'延长截止日期',actionFn:()=>{const nd=new Date(dl);nd.setMonth(nd.getMonth()+1);g.deadline=nd.toISOString().slice(0,10);saveAll();render();},borderColor:'var(--red)'});
    } else {
      // Generate auto subtasks for current month
      const monthTarget = Math.ceil((100 - g.progress) / Math.max(1, Math.ceil(daysLeft/30)));
      smartResults.push({type:'ok',icon:'✅',title:g.title,msg:`进度正常（${g.progress}% / ${timePct}%），本月建议推进 ${monthTarget}%。`,action:'查看本月任务',borderColor:'var(--accent)'});
    }
  });

  // 2. Analyze savings
  const surplus = savings.monthlyIncome - savings.fixedExpenses;
  const totalTarget = savings.goals.reduce((s,g) => s + Math.max(0, g.target - g.current), 0);
  const totalGoals = savings.goals.length;
  if (totalGoals > 0) {
    const avgPerGoal = Math.ceil(surplus * 0.6 / totalGoals);
    const totalMonths = savings.goals.reduce((s,g) => {
      const dl = g.deadline ? new Date(g.deadline+'-01') : new Date(now.getFullYear()+1, 11, 1);
      return s + Math.max(1, Math.ceil((dl - now) / 2592000000));
    }, 0) / totalGoals;

    savings.goals.forEach(g => {
      const remaining = g.target - g.current;
      if (remaining <= 0) return;
      const dl = g.deadline ? new Date(g.deadline+'-01') : new Date(now.getFullYear()+1,11,1);
      const monthsLeft = Math.max(1, Math.ceil((dl - now) / 2592000000));
      const neededPerMonth = Math.ceil(remaining / monthsLeft);
      const canAfford = surplus * 0.4 / totalGoals;

      if (neededPerMonth > canAfford * 1.5) {
        smartResults.push({type:'savings_warn',icon:'💸',title:`${g.icon} ${g.name}`,msg:`每月需存 ¥${neededPerMonth.toLocaleString()}（剩余 ${monthsLeft} 月），但预算仅能分配 ¥${Math.round(canAfford).toLocaleString()}/月。建议延长截止日期或增加收入来源。`,action:'调整存款计划',actionFn:()=>{const nd=new Date(dl);nd.setMonth(nd.getMonth()+Math.ceil(monthsLeft*0.5));g.deadline=nd.toISOString().slice(0,7);saveAll();render();},borderColor:'var(--pink)'});
      } else if (neededPerMonth < canAfford * 0.5) {
        smartResults.push({type:'savings_good',icon:'💰',title:`${g.icon} ${g.name}`,msg:`每月仅需 ¥${neededPerMonth.toLocaleString()} 即可按时完成，预算充足。可将多余 ¥${Math.round(canAfford-neededPerMonth).toLocaleString()}/月 分配给其他目标。`,action:'优化分配',borderColor:'var(--green)'});
      } else {
        smartResults.push({type:'savings_ok',icon:'📊',title:`${g.icon} ${g.name}`,msg:`每月需存 ¥${neededPerMonth.toLocaleString()}，预算匹配，按计划执行即可。`,action:'',borderColor:'var(--accent)'});
      }
    });
  }

  // 3. Monthly balance
  const lastMonthKey = Object.keys(monthlyRecords).sort().pop();
  if (lastMonthKey) {
    const rec = monthlyRecords[lastMonthKey];
    if (rec.saved < rec.target * 0.8) {
      const shortfall = rec.target - rec.saved;
      smartResults.unshift({type:'monthly_warn',icon:'📉',title:`${lastMonthKey} 存款未达标`,msg:`目标 ¥${rec.target.toLocaleString()}，实际 ¥${rec.saved.toLocaleString()}，差额 ¥${shortfall.toLocaleString()}。建议本月节省等额开支弥补。`,action:'记录本月数据',actionFn:()=>{openModal('budget');},borderColor:'var(--red)'});
    }
  }

  // 4. Auto-generate monthly plan
  generateMonthlyPlan();

  render();
}

function generateMonthlyPlan() {
  const now = new Date();
  const plans = {};
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    const tasks = [];
    goals.filter(g => !g.completed).forEach(g => {
      if (g.deadline) {
        const dl = new Date(g.deadline);
        if (dl >= d && (dl.getFullYear() !== now.getFullYear() || dl.getMonth() !== now.getMonth() + i || i === 0)) {
          const remaining = 100 - g.progress;
          const monthsLeft = Math.max(1, Math.ceil((dl - d) / 2592000000));
          const monthPct = Math.min(remaining, Math.ceil(remaining / monthsLeft));
          tasks.push({goalId:g.id,title:g.title,monthPct,category:g.category,color:CATEGORIES.find(c=>c.id===g.category)?.color||'var(--accent)'});
        }
      } else if (i < 3) {
        tasks.push({goalId:g.id,title:g.title,monthPct:5,category:g.category,color:CATEGORIES.find(c=>c.id===g.category)?.color||'var(--accent)'});
      }
    });
    // Savings tasks
    savings.goals.forEach(g => {
      const remaining = g.target - g.current;
      if (remaining > 0) {
        const dl = g.deadline ? new Date(g.deadline+'-01') : new Date(now.getFullYear()+1,11,1);
        const monthsLeft = Math.max(1, Math.ceil((dl - d) / 2592000000));
        const monthlySave = Math.ceil(remaining / monthsLeft);
        tasks.push({goalId:'sv_'+g.id,title:`存入 ¥${monthlySave.toLocaleString()} → ${g.name}`,monthPct:0,isSaving:true,color:g.color});
      }
    });
    plans[key] = {tasks, completed: i > 0 ? Math.random() * 40 + (i > 3 ? 60 : 20) : 0};
  }
  monthlyRecords._plans = plans;
}

function renderSavingsChart() {
  const now = new Date();
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  const surplus = savings.monthlyIncome - savings.fixedExpenses;
  const targetPerMonth = Math.round(surplus * 0.6);
  const maxVal = Math.max(targetPerMonth * 1.5, 10000);
  const records = monthlyRecords;

  let bars = '';
  months.forEach(m => {
    const rec = records[m];
    const actual = rec ? rec.saved : (m <= now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0') ? Math.round(targetPerMonth * (0.7 + Math.random()*0.5)) : 0);
    const h1 = Math.max(2, actual / maxVal * 120);
    const h2 = Math.max(2, targetPerMonth / maxVal * 120);
    bars += `<div class="chart-bar-group"><div class="chart-bar-pair"><div class="chart-bar" style="height:${h1}px;background:var(--accent)" title="实际 ¥${actual.toLocaleString()}"></div><div class="chart-bar" style="height:${h2}px;background:var(--surface-3);border:1px solid var(--border)" title="目标 ¥${targetPerMonth.toLocaleString()}"></div></div><span class="chart-bar-label">${m.slice(5)}月</span></div>`;
  });

  return `<div class="monthly-chart"><div class="monthly-chart-title">月度储蓄趋势</div><div class="monthly-chart-sub">近 6 个月实际存款 vs 目标</div><div class="chart-bars">${bars}</div><div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--accent)"></div>实际存款</div><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--surface-3);border:1px solid var(--border)"></div>月度目标 ¥${targetPerMonth.toLocaleString()}</div></div></div>`;
}

      <span style="font-size:1rem">${g.icon}</span>
      <span style="flex:1;font-size:0.82rem">${g.name}</span>
      <span style="font-size:0.72rem;font-family:var(--font-mono);color:${g.color};background:${g.color}18;padding:2px 8px;border-radius:10px">存入 ¥${mp.toLocaleString()}</span>
    </div>`;
  });
  html += '</div></div>';

  container.innerHTML = html;
}

// ============ RIGHT PANEL ============
function renderStats() {
  const total=goals.length, done=goals.filter(g=>g.completed).length;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('totalRate').textContent=pct+'%';
  document.getElementById('totalSub').textContent=`${done} / ${total} 已完成`;
  document.getElementById('ringProgress').style.strokeDashoffset=213.6-(213.6*pct/100);
  document.getElementById('ringValue').textContent=pct+'%';
  const bd=document.getElementById('ringBreakdown');
  bd.innerHTML='';
  CATEGORIES.filter(c=>c.id!=='all').forEach(cat=>{
    const cnt=goals.filter(g=>g.category===cat.id).length;
    if(!cnt)return;
    const dn=goals.filter(g=>g.category===cat.id&&g.completed).length;
    bd.innerHTML+=`<div class="stats-ring-row"><div class="stats-ring-row-dot" style="background:${cat.color}"></div><span class="stats-ring-row-text">${cat.label}</span><span class="stats-ring-row-val">${dn}/${cnt}</span></div>`;
  });
}

function renderStreak() {
  const grid=document.getElementById('streakGrid');
  grid.innerHTML='';
  const today=new Date();
  const start=new Date(today);
  start.setDate(start.getDate()-27-((start.getDay()+6)%7));
  const sd=JSON.parse(localStorage.getItem('lp_streak')||'{}');
  for(let i=0;i<28;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const isToday=key===today.toISOString().slice(0,10);
    const el=document.createElement('div');
    el.className='streak-day'+(sd[key]?' filled':'')+(isToday?' today':'');
    el.title=key;
    el.onclick=()=>{sd[key]=!sd[key];localStorage.setItem('lp_streak',JSON.stringify(sd));renderStreak();updateStreakCount();};
    grid.appendChild(el);
  }
}

function renderMilestones() {
  const ms=document.getElementById('milestones');
  const completed=goals.filter(g=>g.completed);
  const upcoming=goals.filter(g=>!g.completed&&g.deadline).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,3);
  const items=[...completed.map(g=>({title:g.title,date:'已完成',color:'var(--green)',done:true})),...upcoming.map(g=>({title:g.title,date:g.deadline,color:CATEGORIES.find(c=>c.id===g.category)?.color||'var(--accent)',done:false}))];
  if(!items.length){ms.innerHTML='<div style="font-size:0.78rem;color:var(--text-dim);padding:12px 0">暂无里程碑</div>';return;}
  ms.innerHTML=items.slice(0,5).map((m,i)=>`<div class="milestone-item"><div class="milestone-dot-wrap"><div class="milestone-dot" style="background:${m.done?'var(--green)':m.color};${m.done?'':'opacity:0.5'}"></div>${i<items.length-1?'<div class="milestone-line"></div>':''}</div><div class="milestone-content"><div class="milestone-title" style="${m.done?'color:var(--text-dim);text-decoration:line-through':''}">${m.title}</div><div class="milestone-date">${m.date}</div></div></div>`).join('');
}

function renderQuote() {
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteText').textContent=q.text;
  document.getElementById('quoteAuthor').textContent='—— '+q.author;
}

// ============ ACTIONS ============
function toggleGoal(id){const g=goals.find(x=>x.id===id);if(!g)return;g.completed=!g.completed;g.progress=g.completed?100:Math.min(g.progress,95);if(g.completed&&g.subtasks)g.subtasks.forEach(s=>s.d=true);saveAll();render();}
function deleteGoal(id){if(!confirm('确定删除此目标？'))return;goals=goals.filter(g=>g.id!==id);saveAll();render();}
function editProgress(id){const g=goals.find(x=>x.id===id);if(!g)return;const val=prompt('更新进度 (0-100):',g.progress);if(val===null)return;const num=parseInt(val);if(isNaN(num)||num<0||num>100){alert('请输入0-100');return;}g.progress=num;if(num===100){g.completed=true;if(g.subtasks)g.subtasks.forEach(s=>s.d=true);}else g.completed=false;saveAll();render();}
function toggleSubtask(gid,si){const g=goals.find(x=>x.id===gid);if(!g?.subtasks)return;g.subtasks[si].d=!g.subtasks[si].d;const dc=g.subtasks.filter(s=>s.d).length;g.progress=Math.round(dc/g.subtasks.length*100);g.completed=g.progress===100;saveAll();render();}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderMain();}
function selectPriority(el){document.querySelectorAll('#priorityTags .form-tag-option').forEach(t=>t.classList.remove('selected'));el.classList.add('selected');selectedPriority=el.dataset.val;}
function updateStreakCount(){const sd=JSON.parse(localStorage.getItem('lp_streak')||'{}');let c=0;const t=new Date();for(let i=0;i<365;i++){const d=new Date(t);d.setDate(d.getDate()-i);if(sd[d.toISOString().slice(0,10)])c++;else break;}document.getElementById('streakCount').textContent=c+' 天';}

function openModal(type){
  const id=type==='goal'?'goalModal':type==='savings'?'savingsModal':type==='budget'?'budgetModal':'recordModal';
  document.getElementById(id).classList.add('show');
  if(type==='budget'){
    document.getElementById('budgetIncome').value=savings.monthlyIncome;
    document.getElementById('budgetFixed').value=savings.fixedExpenses;
  }
}
function closeModal(e,id){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('show');}

function addGoal(){
  const title=document.getElementById('goalTitle').value.trim();
  if(!title){alert('请输入目标名称');return;}
  goals.unshift({id:Date.now(),title,desc:document.getElementById('goalDesc').value.trim(),category:document.getElementById('goalCategory').value,priority:selectedPriority,deadline:document.getElementById('goalDeadline').value,progress:0,completed:false,created:new Date().toISOString().slice(0,10),subtasks:[]});
  saveAll();closeModal(null,'goalModal');document.getElementById('goalTitle').value='';document.getElementById('goalDesc').value='';document.getElementById('goalDeadline').value='';render();
}

function addSavingsGoal(){
  const name=document.getElementById('svName').value.trim();
  const target=parseInt(document.getElementById('svTarget').value);
  if(!name||!target){alert('请填写名称和金额');return;}
  const colors=['#e8a838','#3dd68c','#5b9cf5','#e87ab4','#9b7aed','#3dd6c8','#e85454','#f5c842'];
  savings.goals.push({id:Date.now(),name,icon:document.getElementById('svIcon').value,target,current:parseInt(document.getElementById('svCurrent').value)||0,deadline:document.getElementById('svDeadline').value,color:colors[savings.goals.length%colors.length]});
  saveAll();closeModal(null,'savingsModal');document.getElementById('svName').value='';document.getElementById('svTarget').value='';document.getElementById('svCurrent').value='';render();
}

function deleteSavingsGoal(id){if(!confirm('确定删除此存款目标？'))return;savings.goals=savings.goals.filter(g=>g.id!==id);saveAll();render();}

function openRecordModal(gid){pendingRecordGoalId=gid;document.getElementById('recordAmount').value='';openModal('record');}
function confirmRecord(){
  const amt=parseInt(document.getElementById('recordAmount').value);
  if(!amt||amt<=0){alert('请输入有效金额');return;}
  const g=savings.goals.find(x=>x.id===pendingRecordGoalId);
  if(g){g.current=Math.min(g.target,g.current+amt);}
  // Also record monthly
  const now=new Date();
  const mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!monthlyRecords[mk])monthlyRecords[mk]={income:savings.monthlyIncome,fixedExp:savings.fixedExpenses,variableExp:0,saved:0,target:Math.round((savings.monthlyIncome-savings.fixedExpenses)*0.6)};
  monthlyRecords[mk].saved+=amt;
  saveAll();closeModal(null,'recordModal');render();
}

function saveBudget(){
  savings.monthlyIncome=parseInt(document.getElementById('budgetIncome').value)||0;
  savings.fixedExpenses=parseInt(document.getElementById('budgetFixed').value)||0;
  const variable=parseInt(document.getElementById('budgetVariable').value)||0;
  const now=new Date();
  const mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!monthlyRecords[mk])monthlyRecords[mk]={income:savings.monthlyIncome,fixedExp:savings.fixedExpenses,variableExp:0,saved:0,target:Math.round((savings.monthlyIncome-savings.fixedExpenses)*0.6)};
  monthlyRecords[mk].income=savings.monthlyIncome;
  monthlyRecords[mk].fixedExp=savings.fixedExpenses;
  monthlyRecords[mk].variableExp=variable;
  saveAll();closeModal(null,'budgetModal');render();
}

// ============ INIT ============
function updateDate(){const now=new Date();const days=['日','一','二','三','四','五','六'];document.getElementById('headerDate').textContent=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 周${days[now.getDay()]}`;}

updateDate();
generateMonthlyPlan();
saveAll();
render();
</script>
