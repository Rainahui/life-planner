<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生规划清单 — Life Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b0e;--surface:#151419;--surface-2:#1c1b22;--surface-3:#24232c;--border:#2e2d36;
  --accent:#e8a838;--accent-dim:#c78d2a;--accent-glow:rgba(232,168,56,0.12);
  --green:#3dd68c;--red:#e85454;--purple:#9b7aed;--blue:#5b9cf5;--pink:#e87ab4;--teal:#3dd6c8;
  --text:#e8e6e1;--text-mid:#9d9ba6;--text-dim:#5e5c66;
  --font-display:'Noto Serif SC',serif;--font-body:'Noto Sans SC',sans-serif;--font-mono:'Space Mono',monospace;
  --radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app{display:grid;grid-template-columns:260px 1fr 320px;grid-template-rows:auto 1fr;min-height:100vh}
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo svg{width:20px;height:20px}
.header-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700}
.header-subtitle{font-size:0.73rem;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px}
.header-right{display:flex;align-items:center;gap:12px}
.header-date{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-mid);padding:6px 14px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.btn-add{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--accent);color:#0c0b0e;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-add:hover{background:#f0b848;transform:translateY(-1px)}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 0;overflow-y:auto;height:calc(100vh - 77px);position:sticky;top:77px}
.sidebar-section{padding:0 20px;margin-bottom:28px}
.sidebar-label{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:12px;padding-left:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item.active{background:var(--accent-glow);border:1px solid rgba(232,168,56,0.2)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-text{font-size:0.88rem;flex:1}
.nav-count{font-family:var(--font-mono);font-size:0.7rem;color:var(--text-dim);background:var(--surface-3);padding:2px 7px;border-radius:10px}
.sidebar-stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 20px 12px}
.sidebar-stat-label{font-size:0.72rem;color:var(--text-dim);margin-bottom:6px}
.sidebar-stat-value{font-family:var(--font-mono);font-size:1.6rem;font-weight:700;color:var(--accent)}
.sidebar-stat-sub{font-size:0.7rem;color:var(--text-dim);margin-top:4px;font-family:var(--font-mono)}
.main{padding:28px 32px;overflow-y:auto;height:calc(100vh - 77px)}
.main-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.main-title{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.main-title-sub{font-size:0.82rem;color:var(--text-mid);margin-top:4px}
.main-filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;font-size:0.75rem;font-family:var(--font-body);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;color:var(--text-mid);cursor:pointer;transition:all .2s}
.filter-btn.active,.filter-btn:hover{background:var(--accent-glow);border-color:rgba(232,168,56,0.3);color:var(--accent)}
.goals-list{display:flex;flex-direction:column;gap:16px}
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;transition:all .25s;animation:slideIn .5s ease forwards;opacity:0;position:relative;overflow:hidden}
.goal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.goal-card:hover{border-color:var(--surface-3);transform:translateX(4px)}
.goal-card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px}
.goal-checkbox{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-top:2px}
.goal-checkbox:hover{border-color:var(--accent);background:var(--accent-glow)}
.goal-checkbox.checked{background:var(--green);border-color:var(--green)}
.goal-checkbox.checked svg{opacity:1}
.goal-checkbox svg{opacity:0;transition:opacity .2s}
.goal-info{flex:1}
.goal-title{font-size:1rem;font-weight:500;line-height:1.5;margin-bottom:4px}
.goal-card.completed .goal-title{text-decoration:line-through;color:var(--text-dim)}
.goal-desc{font-size:0.8rem;color:var(--text-mid);line-height:1.5}
.goal-meta{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.goal-tag{display:inline-flex;align-items:center;gap:4px;font-size:0.7rem;padding:3px 10px;border-radius:12px;font-family:var(--font-mono)}
.goal-progress-wrap{flex:1;min-width:120px}
.goal-progress-bar-bg{width:100%;height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.goal-progress-bar-fill{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.22,1,.36,1)}
.goal-progress-text{font-size:0.68rem;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:3px;text-align:right}
.goal-actions{display:flex;gap:6px;opacity:0;transition:opacity .2s;margin-left:auto}
.goal-card:hover .goal-actions{opacity:1}
.goal-action-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--text-dim)}
.goal-action-btn:hover{border-color:var(--accent);color:var(--accent)}
.goal-action-btn.delete:hover{border-color:var(--red);color:var(--red)}
.right-panel{background:var(--surface);border-left:1px solid var(--border);padding:24px 20px;overflow-y:auto;height:calc(100vh - 77px);position:sticky;top:77px}
.panel-section{margin-bottom:28px}
.panel-title{font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.18em;margin-bottom:16px}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.streak-day{aspect-ratio:1;border-radius:4px;background:var(--surface-2);cursor:pointer;transition:all .2s}
.streak-day.filled{background:var(--accent);opacity:.9}
.streak-day.today{border:1.5px solid var(--accent);box-shadow:0 0 6px rgba(232,168,56,.3)}
.streak-day:hover{transform:scale(1.15)}
.streak-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.streak-label{text-align:center;font-size:.6rem;color:var(--text-dim);font-family:var(--font-mono)}
.stats-ring-container{display:flex;align-items:center;gap:20px;padding:16px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--border)}
.stats-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.stats-ring svg{transform:rotate(-90deg)}
.stats-ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--accent)}
.stats-ring-info{flex:1}
.stats-ring-label{font-size:.78rem;color:var(--text-mid);margin-bottom:6px}
.stats-ring-breakdown{display:flex;flex-direction:column;gap:4px}
.stats-ring-row{display:flex;align-items:center;gap:6px;font-size:.7rem}
.stats-ring-row-dot{width:6px;height:6px;border-radius:50%}
.stats-ring-row-text{color:var(--text-mid);flex:1}
.stats-ring-row-val{font-family:var(--font-mono);color:var(--text);font-weight:500}
.quote-card{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.quote-card::before{content:'\201C';position:absolute;top:-10px;left:12px;font-family:var(--font-display);font-size:5rem;color:var(--accent);opacity:.08;line-height:1}
.quote-text{font-family:var(--font-display);font-size:.92rem;font-weight:300;line-height:1.7;color:var(--text-mid);margin-bottom:10px;position:relative;z-index:1}
.quote-author{font-size:.72rem;color:var(--text-dim);font-family:var(--font-mono)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:600px;max-width:94vw;max-height:85vh;overflow-y:auto;padding:32px;animation:slideUp .35s cubic-bezier(.22,1,.36,1)}
.modal-sm{width:440px}
.modal-title{font-family:var(--font-display);font-size:1.3rem;font-weight:700;margin-bottom:24px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:.78rem;color:var(--text-mid);margin-bottom:6px;font-weight:500}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-body);font-size:.88rem;outline:none;transition:border-color .2s}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:72px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-tags{display:flex;flex-wrap:wrap;gap:8px}
.form-tag-option{padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:.78rem;cursor:pointer;transition:all .2s;color:var(--text-mid);background:var(--surface-2)}
.form-tag-option.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn-cancel{padding:9px 22px;background:transparent;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-mid);font-family:var(--font-body);font-size:.85rem;cursor:pointer;transition:all .2s}
.btn-cancel:hover{border-color:var(--text-dim)}
.btn-submit{padding:9px 22px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#0c0b0e;font-family:var(--font-body);font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-submit:hover{background:#f0b848}

/* Savings */
.savings-overview{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.savings-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.savings-stat-label{font-size:.72rem;color:var(--text-dim);margin-bottom:8px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em}
.savings-stat-value{font-family:var(--font-mono);font-size:1.6rem;font-weight:700}
.savings-stat-sub{font-size:.7rem;color:var(--text-dim);margin-top:6px}
.savings-goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:28px}
.savings-goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;transition:all .25s;animation:slideIn .5s ease forwards;opacity:0}
.savings-goal-card:hover{transform:translateY(-3px)}
.savings-goal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.savings-goal-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.savings-goal-name{font-size:.95rem;font-weight:600}
.savings-goal-deadline{font-size:.68rem;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px}
.savings-goal-amounts{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.savings-goal-current{font-family:var(--font-mono);font-size:1.2rem;font-weight:700}
.savings-goal-target{font-family:var(--font-mono);font-size:.75rem;color:var(--text-dim)}
.savings-goal-bar{width:100%;height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:12px}
.savings-goal-bar-fill{height:100%;border-radius:3px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.savings-goal-monthly{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text-dim);margin-top:4px}
.savings-goal-monthly-val{font-family:var(--font-mono);color:var(--text-mid);font-weight:500}
.savings-goal-actions{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.savings-goal-btn{flex:1;padding:6px;font-size:.72rem;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-mid);cursor:pointer;transition:all .2s;font-family:var(--font-body);text-align:center}
.savings-goal-btn:hover{border-color:var(--accent);color:var(--accent)}
.savings-goal-btn.primary{background:var(--accent-glow);border-color:rgba(232,168,56,.3);color:var(--accent)}

/* Monthly plan */
.monthly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:28px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0;transition:all .2s;animation:slideIn .5s ease forwards;opacity:0;overflow:hidden}
.month-card.current{border-color:var(--accent);box-shadow:0 0 16px rgba(232,168,56,.08)}
.month-card.locked{border-color:var(--purple);box-shadow:0 0 12px rgba(155,122,237,.08)}
.month-card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.month-card-name{font-family:var(--font-mono);font-size:.88rem;font-weight:700}
.month-card-controls{display:flex;align-items:center;gap:8px}
.month-badge{font-size:.6rem;padding:2px 8px;border-radius:10px;font-family:var(--font-mono)}
.month-lock-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .2s}
.month-lock-btn:hover{border-color:var(--purple);color:var(--purple)}
.month-lock-btn.on{background:rgba(155,122,237,.15);border-color:var(--purple);color:var(--purple)}
.month-card-body{padding:16px 20px}
.month-task{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(46,45,54,.5);transition:all .15s}
.month-task:last-child{border-bottom:none}
.month-task:hover{background:rgba(255,255,255,.02);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.month-task-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.month-task-check.done{background:var(--green);border-color:var(--green)}
.month-task-check.done svg{opacity:1}
.month-task-check svg{opacity:0}
.month-task-content{flex:1;min-width:0}
.month-task-title{font-size:.78rem;color:var(--text-mid);cursor:pointer;padding:2px 4px;border-radius:4px;transition:all .15s}
.month-task-title:hover{background:var(--surface-3);color:var(--text)}
.month-task-title input{background:transparent;border:none;color:var(--text);font-family:var(--font-body);font-size:.78rem;width:100%;outline:none;padding:0}
.month-task-meta{display:flex;align-items:center;gap:8px;margin-top:2px}
.month-task-tag{font-size:.58rem;padding:1px 6px;border-radius:8px;font-family:var(--font-mono);white-space:nowrap}
.month-task-val{font-size:.68rem;font-family:var(--font-mono);color:var(--accent);cursor:pointer;padding:1px 4px;border-radius:3px}
.month-task-val:hover{background:var(--accent-glow)}
.month-task-val input{width:50px;background:transparent;border:none;color:var(--accent);font-family:var(--font-mono);font-size:.68rem;outline:none;text-align:right}
.month-task-del{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s;font-size:.7rem}
.month-task:hover .month-task-del{opacity:1}
.month-task-del:hover{color:var(--red)}
.month-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:8px;margin:8px 20px 16px;border:1px dashed var(--border);border-radius:var(--radius-sm);font-size:.72rem;color:var(--text-dim);cursor:pointer;transition:all .2s;background:transparent;width:calc(100% - 40px)}
.month-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.month-card-foot{padding:10px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.65rem;color:var(--text-dim);font-family:var(--font-mono)}
.month-notes{padding:0 20px 12px}
.month-notes textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-mid);font-family:var(--font-body);font-size:.72rem;padding:8px 10px;resize:none;outline:none;min-height:36px;transition:border-color .2s}
.month-notes textarea:focus{border-color:var(--accent)}

/* Smart panel */
.smart-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:28px;position:relative;overflow:hidden}
.smart-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--green),var(--blue))}
.smart-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.smart-panel-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.btn-smart{display:flex;align-items:center;gap:6px;padding:8px 18px;background:linear-gradient(135deg,var(--accent),var(--green));color:#0c0b0e;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.82rem;font-weight:700;cursor:pointer;transition:all .3s}
.btn-smart:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(232,168,56,.3)}
.smart-results{display:flex;flex-direction:column;gap:12px}
.smart-item{display:flex;gap:14px;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm);border-left:3px solid var(--border);animation:slideIn .4s ease forwards;opacity:0}
.smart-item-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.smart-item-content{flex:1}
.smart-item-title{font-size:.82rem;font-weight:600;margin-bottom:3px}
.smart-item-msg{font-size:.75rem;color:var(--text-mid);line-height:1.5}
.smart-item-action{font-size:.7rem;color:var(--accent);margin-top:4px;cursor:pointer;font-weight:500}
.smart-item-action:hover{text-decoration:underline}
.smart-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.smart-summary-card{background:var(--surface-2);border-radius:var(--radius-sm);padding:14px;text-align:center}
.smart-summary-val{font-family:var(--font-mono);font-size:1.3rem;font-weight:700;margin-bottom:4px}
.smart-summary-label{font-size:.68rem;color:var(--text-dim)}

/* Config modal extras */
.config-income-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(46,45,54,.4)}
.config-income-label{width:50px;font-size:.78rem;color:var(--text-mid);font-family:var(--font-mono)}
.config-income-input{flex:1;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:.78rem;outline:none}
.config-income-input:focus{border-color:var(--accent)}
.expense-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.expense-row input{padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:.78rem;outline:none}
.expense-row input:focus{border-color:var(--accent)}
.expense-row .form-input{padding:6px 10px;font-size:.78rem}
.expense-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.8rem;padding:4px}
.expense-del:hover{color:var(--red)}

/* Chart */
.monthly-chart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:28px}
.monthly-chart-title{font-size:.92rem;font-weight:600;margin-bottom:4px}
.monthly-chart-sub{font-size:.72rem;color:var(--text-dim);margin-bottom:20px;font-family:var(--font-mono)}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:160px;padding-bottom:28px;position:relative;border-bottom:1px solid var(--border)}
.chart-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.chart-bar-pair{display:flex;gap:3px;align-items:flex-end;height:130px;width:100%}
.chart-bar{flex:1;border-radius:3px 3px 0 0;transition:height .8s cubic-bezier(.22,1,.36,1);min-height:2px}
.chart-bar-label{position:absolute;bottom:-24px;font-size:.6rem;color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap}
.chart-legend{display:flex;gap:16px;margin-top:16px;justify-content:center}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text-mid)}
.chart-legend-dot{width:8px;height:8px;border-radius:2px}

.empty-state{text-align:center;padding:60px 20px}
.empty-state-text{font-size:.92rem;color:var(--text-dim);margin-bottom:6px}
.empty-state-sub{font-size:.78rem;color:var(--text-dim);opacity:.6}
.btn-outline{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-mid);font-family:var(--font-body);font-size:.78rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}

.milestone-item{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.milestone-item:last-child{border-bottom:none}
.milestone-dot-wrap{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.milestone-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.milestone-line{width:1px;flex:1;background:var(--border);margin-top:4px}
.milestone-content{flex:1}
.milestone-title{font-size:.82rem;font-weight:500;margin-bottom:2px}
.milestone-date{font-size:.68rem;color:var(--text-dim);font-family:var(--font-mono)}

@keyframes slideIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:1100px){.app{grid-template-columns:220px 1fr}.right-panel{display:none}}
@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.header{padding:16px}.form-row{grid-template-columns:1fr}.savings-overview{grid-template-columns:1fr}.monthly-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#0c0b0e" stroke-width="2.5" stroke-linecap="round"><path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8Z"/></svg></div>
      <div><div class="header-title">人生规划清单</div><div class="header-subtitle">LIFE PLANNER v4.0</div></div>
    </div>
    <div class="header-right">
      <div class="header-date" id="headerDate"></div>
      <button class="btn-add" id="btnAddMain" onclick="openModal('goal')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        新建目标
      </button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-section"><div class="sidebar-label">人生维度</div><div id="navList"></div></div>
    <div class="sidebar-section"><div class="sidebar-label">规划工具</div><div id="toolNav"></div></div>
    <div class="sidebar-section"><div class="sidebar-label">概览</div>
      <div class="sidebar-stat-card"><div class="sidebar-stat-label">总完成率</div><div class="sidebar-stat-value" id="totalRate">0%</div><div class="sidebar-stat-sub" id="totalSub"></div></div>
      <div class="sidebar-stat-card"><div class="sidebar-stat-label">连续打卡</div><div class="sidebar-stat-value" id="streakCount">0 天</div><div class="sidebar-stat-sub">保持专注，持续前行</div></div>
    </div>
  </aside>

  <main class="main" id="mainContent"></main>

  <aside class="right-panel">
    <div class="panel-section"><div class="panel-title">完成概览</div>
      <div class="stats-ring-container">
        <div class="stats-ring"><svg width="80" height="80" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" stroke="var(--surface-3)" stroke-width="6" fill="none"/><circle cx="40" cy="40" r="34" stroke="var(--accent)" stroke-width="6" fill="none" stroke-dasharray="213.6" stroke-dashoffset="213.6" stroke-linecap="round" id="ringProgress"/></svg><div class="stats-ring-value" id="ringValue">0%</div></div>
        <div class="stats-ring-info"><div class="stats-ring-label">目标完成分布</div><div class="stats-ring-breakdown" id="ringBreakdown"></div></div>
      </div>
    </div>
    <div class="panel-section"><div class="panel-title">打卡日历 · 近4周</div>
      <div class="streak-labels"><span class="streak-label">一</span><span class="streak-label">二</span><span class="streak-label">三</span><span class="streak-label">四</span><span class="streak-label">五</span><span class="streak-label">六</span><span class="streak-label">日</span></div>
      <div class="streak-grid" id="streakGrid"></div>
    </div>
    <div class="panel-section"><div class="panel-title">里程碑</div><div id="milestones"></div></div>
    <div class="panel-section"><div class="panel-title">每日箴言</div>
      <div class="quote-card"><div class="quote-text" id="quoteText"></div><div class="quote-author" id="quoteAuthor"></div></div>
    </div>
  </aside>
</div>

<!-- GOAL MODAL -->
<div class="modal-overlay" id="goalModal" onclick="closeModal(event,'goalModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">新建人生目标</div>
    <div class="form-group"><label class="form-label">目标名称</label><input class="form-input" id="goalTitle" placeholder="例：学会一门新语言" maxlength="50"></div>
    <div class="form-group"><label class="form-label">详细描述</label><textarea class="form-textarea" id="goalDesc" placeholder="具体描述你的目标和计划..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">所属维度</label><select class="form-select" id="goalCategory"><option value="career">💼 职业发展</option><option value="health">🏃 健康生活</option><option value="finance">💰 财务自由</option><option value="learn">📚 学习成长</option><option value="social">🤝 人际关系</option><option value="family">🏠 家庭生活</option><option value="hobby">🎨 兴趣爱好</option><option value="spirit">🧘 心灵修养</option></select></div>
      <div class="form-group"><label class="form-label">截止日期</label><input class="form-input" type="date" id="goalDeadline"></div>
    </div>
    <div class="form-group"><label class="form-label">优先级</label><div class="form-tags"><div class="form-tag-option" data-val="high" onclick="selectPriority(this)">🔴 紧急重要</div><div class="form-tag-option selected" data-val="mid" onclick="selectPriority(this)">🟡 重要</div><div class="form-tag-option" data-val="low" onclick="selectPriority(this)">🔵 一般</div></div></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal(null,'goalModal')">取消</button><button class="btn-submit" onclick="addGoal()">创建目标</button></div>
  </div>
</div>

<!-- SAVINGS MODAL -->
<div class="modal-overlay" id="savingsModal" onclick="closeModal(event,'savingsModal')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-title">添加存款目标</div>
    <div class="form-group"><label class="form-label">目标名称</label><input class="form-input" id="svName" placeholder="例：应急基金"></div>
    <div class="form-row"><div class="form-group"><label class="form-label">目标金额 (¥)</label><input class="form-input" type="number" id="svTarget" placeholder="100000"></div><div class="form-group"><label class="form-label">当前已存 (¥)</label><input class="form-input" type="number" id="svCurrent" placeholder="0"></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">截止日期</label><input class="form-input" type="month" id="svDeadline"></div><div class="form-group"><label class="form-label">图标</label><select class="form-select" id="svIcon"><option value="🛡️">🛡️ 应急基金</option><option value="🏠">🏠 购房基金</option><option value="✈️">✈️ 旅行基金</option><option value="📈">📈 投资本金</option><option value="🎓">🎓 教育基金</option><option value="🚗">🚗 购车基金</option><option value="💍">💍 结婚基金</option><option value="🎯">🎯 自定义</option></select></div></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal(null,'savingsModal')">取消</button><button class="btn-submit" onclick="addSavingsGoal()">添加</button></div>
  </div>
</div>

<!-- BUDGET MODAL -->
<div class="modal-overlay" id="budgetModal" onclick="closeModal(event,'budgetModal')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-title">本月预算设置</div>
    <div class="form-group"><label class="form-label">月收入 (¥)</label><input class="form-input" type="number" id="budgetIncome"></div>
    <div class="form-group"><label class="form-label">固定支出 (¥)</label><input class="form-input" type="number" id="budgetFixed"></div>
    <div class="form-group"><label class="form-label">实际消费 (¥)</label><input class="form-input" type="number" id="budgetVariable" placeholder="本月实际可变消费"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal(null,'budgetModal')">取消</button><button class="btn-submit" onclick="saveBudget()">保存</button></div>
  </div>
</div>

<!-- RECORD SAVINGS MODAL -->
<div class="modal-overlay" id="recordModal" onclick="closeModal(event,'recordModal')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">
    <div class="modal-title">记录存款</div>
    <div class="form-group"><label class="form-label">存入金额 (¥)</label><input class="form-input" type="number" id="recordAmount"></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal(null,'recordModal')">取消</button><button class="btn-submit" onclick="confirmRecord()">确认存入</button></div>
  </div>
</div>

<!-- PLAN CONFIG MODAL -->
<div class="modal-overlay" id="configModal" onclick="closeModal(event,'configModal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">⚙️ 计划生成配置</div>
    <div class="form-group"><label class="form-label">默认月收入 (¥)</label><input class="form-input" type="number" id="cfgIncome"></div>
    <div class="form-group"><label class="form-label">固定月支出 (¥)</label><input class="form-input" type="number" id="cfgFixed"></div>
    <div class="form-group"><label class="form-label">储蓄率 (%)</label><input class="form-input" type="number" id="cfgSaveRate" min="0" max="100" placeholder="建议 30-60"></div>
    <div class="form-group"><label class="form-label">可支配时间 (小时/周)</label><input class="form-input" type="number" id="cfgHours" placeholder="用于目标推进的时间"></div>
    <div class="form-group">
      <label class="form-label">月收入变动（奖金月 / 降薪月等）</label>
      <div id="cfgIncomeOverrides"></div>
      <button class="btn-outline" style="margin-top:8px" onclick="addIncomeOverride()">+ 添加月份变动</button>
    </div>
    <div class="form-group">
      <label class="form-label">已知大额支出（旅行、年货、礼金等）</label>
      <div id="cfgExpenses"></div>
      <button class="btn-outline" style="margin-top:8px" onclick="addCfgExpense()">+ 添加支出项</button>
    </div>
    <div class="form-group">
      <label class="form-label">自适应模式</label>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="form-tag-option selected" id="cfgAdaptive" onclick="this.classList.toggle('selected')">根据历史完成率自动调整</div>
      </div>
    </div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeModal(null,'configModal')">取消</button><button class="btn-submit" onclick="savePlanConfig()">保存配置</button></div>
  </div>
</div>

<script>
// ===== CONSTANTS =====
const CATS=[
  {id:'all',label:'全部目标',icon:'',color:'var(--accent)'},
  {id:'career',label:'职业发展',icon:'💼',color:'#e8a838'},
  {id:'health',label:'健康生活',icon:'🏃',color:'#3dd68c'},
  {id:'finance',label:'财务自由',icon:'💰',color:'#f5c842'},
  {id:'learn',label:'学习成长',icon:'📚',color:'#5b9cf5'},
  {id:'social',label:'人际关系',icon:'🤝',color:'#e87ab4'},
  {id:'family',label:'家庭生活',icon:'🏠',color:'#3dd6c8'},
  {id:'hobby',label:'兴趣爱好',icon:'🎨',color:'#9b7aed'},
  {id:'spirit',label:'心灵修养',icon:'🧘',color:'#e85454'},
];
const MONTH_NAMES=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const QUOTES=[
  {t:'不积跬步，无以至千里；不积小流，无以成江海。',a:'荀子·劝学'},
  {t:'千里之行，始于足下。',a:'老子·道德经'},
  {t:'天行健，君子以自强不息。',a:'周易·乾卦'},
  {t:'博学之，审问之，慎思之，明辨之，笃行之。',a:'中庸'},
  {t:'路漫漫其修远兮，吾将上下而求索。',a:'屈原·离骚'},
  {t:'业精于勤，荒于嬉；行成于思，毁于随。',a:'韩愈·进学解'},
  {t:'知之者不如好之者，好之者不如乐之者。',a:'论语·雍也'},
  {t:'合抱之木，生于毫末；九层之台，起于累土。',a:'老子·道德经'},
];

// ===== STATE =====
let currentView='all',currentFilter='all',selectedPriority='mid',pendingRecordGoalId=null;

// ===== DATA =====
function ld(k,d){try{const v=localStorage.getItem('lp_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){localStorage.setItem('lp_'+k,JSON.stringify(v))}

let goals=ld('goals',null);
if(!goals) goals=[
  {id:1,title:'完成 PMP 认证考试',desc:'系统学习项目管理',category:'career',priority:'high',deadline:'2026-03-15',progress:65,completed:false,created:'2025-12-01',subtasks:[{t:'报名',d:true},{t:'模拟题',d:true},{t:'复习',d:false},{t:'考试',d:false}]},
  {id:2,title:'每天跑步 5 公里',desc:'坚持晨跑',category:'health',priority:'mid',deadline:'2026-06-30',progress:40,completed:false,created:'2026-01-01',subtasks:[{t:'第1月',d:true},{t:'配速6min',d:false},{t:'半马',d:false}]},
  {id:3,title:'储蓄 10 万应急基金',desc:'每月固定储蓄',category:'finance',priority:'high',deadline:'2026-12-31',progress:30,completed:false,created:'2026-01-01',subtasks:[{t:'预算',d:true},{t:'账户',d:true},{t:'5万',d:false},{t:'10万',d:false}]},
  {id:4,title:'阅读 24 本经典书籍',desc:'每月 2 本',category:'learn',priority:'mid',deadline:'2026-12-31',progress:25,completed:false,created:'2026-01-01',subtasks:[{t:'书单',d:true},{t:'Q1',d:true},{t:'上半年',d:false},{t:'24本',d:false}]},
  {id:5,title:'学会弹吉他',desc:'自弹自唱10首',category:'hobby',priority:'low',deadline:'2026-09-01',progress:15,completed:false,created:'2026-02-01',subtasks:[{t:'买吉他',d:true},{t:'和弦',d:false},{t:'第一首',d:false}]},
  {id:6,title:'每周给家人打电话',desc:'保持联系',category:'family',priority:'mid',deadline:'',progress:80,completed:false,created:'2026-01-01',subtasks:[{t:'习惯',d:true},{t:'3月',d:true},{t:'半年',d:false}]},
  {id:7,title:'每天冥想 15 分钟',desc:'提升专注力',category:'spirit',priority:'low',deadline:'',progress:50,completed:false,created:'2026-01-15',subtasks:[{t:'学方法',d:true},{t:'21天',d:true},{t:'习惯',d:false}]},
  {id:8,title:'建立个人技术博客',desc:'打造个人品牌',category:'career',priority:'mid',deadline:'2026-04-30',progress:100,completed:true,created:'2025-11-01',subtasks:[{t:'搭建',d:true},{t:'10篇',d:true},{t:'1k访问',d:true}]},
];

let savings=ld('savings',{
  goals:[
    {id:1,name:'应急基金',icon:'🛡️',target:100000,current:32000,deadline:'2026-12',color:'#e8a838'},
    {id:2,name:'旅行基金',icon:'✈️',target:30000,current:8000,deadline:'2026-09',color:'#5b9cf5'},
    {id:3,name:'投资启动金',icon:'📈',target:200000,current:45000,deadline:'2027-06',color:'#3dd68c'},
  ]
});

let planConfig=ld('planConfig',{
  monthlyIncome:15000,
  fixedExpenses:5000,
  saveRate:50,
  availableHours:15,
  incomeOverrides:{},
  futureExpenses:[{month:'2026-02',name:'春节红包',amount:5000},{month:'2026-10',name:'年假旅行',amount:8000}],
  adaptiveMode:true,
});

let monthlyPlans=ld('monthlyPlans',{});
let monthlyRecords=ld('monthly',{});

function saveGoals(){sv('goals',goals)}
function saveSavings(){sv('savings',savings)}
function savePlans(){sv('monthlyPlans',monthlyPlans)}
function saveConfig(){sv('planConfig',planConfig)}

// ===== SMART PLAN GENERATION =====
function getMonthIncome(key){
  const[m]=key.split('-').map(Number);
  return planConfig.incomeOverrides[m]||planConfig.monthlyIncome;
}
function getMonthExpenses(key){
  return planConfig.futureExpenses.filter(e=>e.month===key).reduce((s,e)=>s+e.amount,0);
}

function generateAllPlans(){
  const now=new Date();
  for(let i=0;i<6;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    // Skip locked months
    if(monthlyPlans[key]?.locked) continue;
    const tasks=[];
    const income=getMonthIncome(key);
    const extraExp=getMonthExpenses(key);
    const available=Math.max(0,income-planConfig.fixedExpenses-extraExp);
    const saveBudget=Math.round(available*planConfig.saveRate/100);

    // Goal tasks - weighted allocation
    const activeGoals=goals.filter(g=>!g.completed);
    const totalWeight=activeGoals.reduce((s,g)=>{
      const priW={high:2,mid:1.2,low:0.7}[g.priority]||1;
      const urgency=g.deadline?Math.max(0.5,1/Math.max(1,Math.ceil((new Date(g.deadline)-now)/2592000000))):0.3;
      return s+priW*urgency;
    },0);

    activeGoals.forEach(g=>{
      const remaining=100-g.progress;
      if(remaining<=0) return;
      const dl=g.deadline?new Date(g.deadline):new Date(now.getFullYear()+1,11,31);
      const ml=Math.max(1,Math.ceil((dl-d)/2592000000));
      const priW={high:2,mid:1.2,low:0.7}[g.priority]||1;
      const urgency=g.deadline?Math.max(0.5,1/Math.max(1,Math.ceil((dl-d)/2592000000))):0.3;
      let rawPct=Math.ceil(remaining/ml*(priW*urgency/totalWeight)*activeGoals.length);
      // Adaptive: if user historically completes less, reduce target
      if(planConfig.adaptiveMode&&i>0){
        const histRate=getHistoricalRate();
        if(histRate<0.7) rawPct=Math.round(rawPct*histRate);
      }
      rawPct=Math.max(2,Math.min(remaining,rawPct));
      const ci=CATS.find(c=>c.id===g.category);
      tasks.push({id:'g'+g.id+'_'+key,goalId:g.id,type:'goal',title:g.title,pct:rawPct,amount:0,done:false,auto:true,color:ci?.color||'var(--accent)',icon:ci?.icon||'📌'});
    });

    // Savings tasks
    let svIdx=0;
    savings.goals.forEach(g=>{
      const rem=g.target-g.current;
      if(rem<=0) return;
      const dl=g.deadline?new Date(g.deadline+'-01'):new Date(now.getFullYear()+2,0,1);
      const ml=Math.max(1,Math.ceil((dl-d)/2592000000));
      const monthlySave=Math.min(rem,Math.ceil(rem/ml));
      const alloc=Math.round(saveBudget*savings.goals.filter(x=>x.target>x.current).length?monthlySave/activeGoals.length:monthlySave);
      const finalAmt=Math.min(rem,Math.max(100,Math.ceil(saveBudget/savings.goals.filter(x=>(x.target-x.current)>0).length)));
      tasks.push({id:'s'+g.id+'_'+key,goalId:'sv_'+g.id,type:'saving',title:`存入 ${g.name}`,pct:0,amount:finalAmt,done:false,auto:true,color:g.color,icon:g.icon});
      svIdx++;
    });

    // Weekly habits
    activeGoals.filter(g=>!g.deadline).forEach(g=>{
      const ci=CATS.find(c=>c.id===g.category);
      tasks.push({id:'h'+g.id+'_'+key,goalId:g.id,type:'habit',title:g.title+'（持续）',pct:3,amount:0,done:false,auto:true,color:ci?.color||'var(--accent)',icon:ci?.icon||'📌'});
    });

    monthlyPlans[key]={locked:false,notes:monthlyPlans[key]?.notes||'',tasks};
  }
  savePlans();
}

function getHistoricalRate(){
  const keys=Object.keys(monthlyRecords).sort().slice(-3);
  if(!keys.length) return 0.8;
  let totalTarget=0,totalDone=0;
  keys.forEach(k=>{
    const r=monthlyRecords[k];
    if(r){totalTarget+=r.target||0;totalDone+=r.saved||0;}
  });
  return totalTarget>0?Math.min(1,totalDone/totalTarget):0.8;
}

// ===== PLAN EDITING FUNCTIONS =====
function toggleMonthLock(key){
  if(!monthlyPlans[key]) monthlyPlans[key]={locked:false,notes:'',tasks:[]};
  monthlyPlans[key].locked=!monthlyPlans[key].locked;
  savePlans();render();
}

function togglePlanTask(key,idx){
  const plan=monthlyPlans[key];if(!plan?.tasks?.[idx])return;
  plan.tasks[idx].done=!plan.tasks[idx].done;
  savePlans();render();
}

function editPlanTaskTitle(key,idx){
  const plan=monthlyPlans[key];if(!plan?.tasks?.[idx])return;
  const old=plan.tasks[idx].title;
  const val=prompt('编辑任务名称:',old);
  if(val&&val.trim()){
    plan.tasks[idx].title=val.trim();
    plan.tasks[idx].auto=false;
    savePlans();render();
  }
}

function editPlanTaskVal(key,idx,field){
  const plan=monthlyPlans[key];if(!plan?.tasks?.[idx])return;
  const t=plan.tasks[idx];
  const old=t[field];
  const label=field==='amount'?'金额 (¥)':'百分比 (%)';
  const val=prompt(`编辑${label}:`,old);
  if(val===null)return;
  const num=parseInt(val);
  if(isNaN(num)||num<0)return;
  t[field]=num;
  t.auto=false;
  savePlans();render();
}

function deletePlanTask(key,idx){
  const plan=monthlyPlans[key];if(!plan?.tasks)return;
  plan.tasks.splice(idx,1);
  savePlans();render();
}

function addPlanTask(key){
  if(!monthlyPlans[key]) monthlyPlans[key]={locked:false,notes:'',tasks:[]};
  const title=prompt('任务名称:');
  if(!title?.trim())return;
  const type=prompt('任务类型 (1=目标百分比 2=存款金额 3=习惯):','1');
  const task={id:'custom_'+Date.now(),goalId:null,type:type==='2'?'saving':type==='3'?'habit':'goal',title:title.trim(),pct:type==='2'?0:5,amount:type==='2'?1000:0,done:false,auto:false,color:'var(--purple)',icon:'✨'};
  monthlyPlans[key].tasks.push(task);
  if(monthlyPlans[key].locked===undefined)monthlyPlans[key].locked=false;
  savePlans();render();
}

function savePlanNotes(key,val){
  if(!monthlyPlans[key])monthlyPlans[key]={locked:false,notes:'',tasks:[]};
  monthlyPlans[key].notes=val;
  savePlans();
}

function regenerateAll(){
  if(!confirm('重新生成所有未锁定月份的计划？\n（已锁定月份和手动修改会保留）'))return;
  // Only clear unlocked
  Object.keys(monthlyPlans).forEach(k=>{
    if(!monthlyPlans[k].locked){delete monthlyPlans[k];}
  });
  generateAllPlans();
  render();
}

  const ex=document.getElementById('cfgExpenses');ex.innerHTML='';
  planConfig.futureExpenses.forEach((e,i)=>{
    ex.innerHTML+=`<div class="expense-row"><input type="month" value="${e.month}" data-idx="${i}" class="expense-field-month" style="width:140px"><input type="text" value="${e.name}" placeholder="名称" data-idx="${i}" class="expense-field-name" style="flex:1"><input type="number" value="${e.amount}" placeholder="金额" data-idx="${i}" class="expense-field-amount" style="width:100px"><button class="expense-del" onclick="removeCfgExpense(${i})">✕</button></div>`;
  });
  openModal('config');
}

function addIncomeOverride(){
  const m=prompt('月份 (1-12):');if(!m)return;
  const v=prompt(`该月收入 (¥):`,planConfig.monthlyIncome);if(!v)return;
  planConfig.incomeOverrides[parseInt(m)]=parseInt(v);
  openPlanConfig(); // refresh
}

function updateIncomeOverride(el){
  planConfig.incomeOverrides[parseInt(el.dataset.month)]=parseInt(el.value)||0;
}

function removeIncomeOverride(m){
  delete planConfig.incomeOverrides[m];
  openPlanConfig();
}

function addCfgExpense(){
  planConfig.futureExpenses.push({month:'',name:'',amount:0});
  openPlanConfig();
}

function removeCfgExpense(i){
  planConfig.futureExpenses.splice(i,1);
  openPlanConfig();
}

function savePlanConfig(){
  planConfig.monthlyIncome=parseInt(document.getElementById('cfgIncome').value)||0;
  planConfig.fixedExpenses=parseInt(document.getElementById('cfgFixed').value)||0;
  planConfig.saveRate=parseInt(document.getElementById('cfgSaveRate').value)||50;
  planConfig.availableHours=parseInt(document.getElementById('cfgHours').value)||10;
  planConfig.adaptiveMode=document.getElementById('cfgAdaptive').classList.contains('selected');
  // Read expense fields back
  document.querySelectorAll('.expense-field-month').forEach((el,i)=>{
    if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].month=el.value;
  });
  document.querySelectorAll('.expense-field-name').forEach((el,i)=>{
    if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].name=el.value;
  });
  document.querySelectorAll('.expense-field-amount').forEach((el,i)=>{
    if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].amount=parseInt(el.value)||0;
  });
  saveConfig();
  // Regenerate with new config
  Object.keys(monthlyPlans).forEach(k=>{if(!monthlyPlans[k].locked)delete monthlyPlans[k]});
  closeModal(null,'configModal');
  render();
}

// ===== RIGHT PANEL =====
function renderStats(){
  const t=goals.length,d=goals.filter(g=>g.completed).length,p=t>0?Math.round(d/t*100):0;
  document.getElementById('totalRate').textContent=p+'%';
  document.getElementById('totalSub').textContent=`${d} / ${t} 已完成`;
  document.getElementById('ringProgress').style.strokeDashoffset=213.6-(213.6*p/100);
  document.getElementById('ringValue').textContent=p+'%';
  const bd=document.getElementById('ringBreakdown');bd.innerHTML='';
  CATS.filter(c=>c.id!=='all').forEach(cat=>{
    const cnt=goals.filter(g=>g.category===cat.id).length;if(!cnt)return;
    const dn=goals.filter(g=>g.category===cat.id&&g.completed).length;
    bd.innerHTML+=`<div class="stats-ring-row"><div class="stats-ring-row-dot" style="background:${cat.color}"></div><span class="stats-ring-row-text">${cat.label}</span><span class="stats-ring-row-val">${dn}/${cnt}</span></div>`;
  });
}

function renderStreak(){
  const grid=document.getElementById('streakGrid');grid.innerHTML='';
  const today=new Date(),start=new Date(today);start.setDate(start.getDate()-27-((start.getDay()+6)%7));
  const sd=ld('streak',{});
  for(let i=0;i<28;i++){
    const d=new Date(start);d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10);
    const el=document.createElement('div');el.className='streak-day'+(sd[key]?' filled':'')+(key===today.toISOString().slice(0,10)?' today':'');
    el.title=key;el.onclick=()=>{sd[key]=!sd[key];sv('streak',sd);renderStreak();updateStreakCount()};
    grid.appendChild(el);
  }
}

function renderMilestones(){
  const ms=document.getElementById('milestones');
  const items=[...goals.filter(g=>g.completed).map(g=>({title:g.title,date:'已完成',color:'var(--green)',done:true})),...goals.filter(g=>!g.completed&&g.deadline).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,3).map(g=>({title:g.title,date:g.deadline,color:CATS.find(c=>c.id===g.category)?.color||'var(--accent)',done:false}))];
  if(!items.length){ms.innerHTML='<div style="font-size:.78rem;color:var(--text-dim);padding:12px 0">暂无里程碑</div>';return}
  ms.innerHTML=items.slice(0,5).map((m,i)=>`<div class="milestone-item"><div class="milestone-dot-wrap"><div class="milestone-dot" style="background:${m.done?'var(--green)':m.color}"></div>${i<items.length-1?'<div class="milestone-line"></div>':''}</div><div class="milestone-content"><div class="milestone-title" style="${m.done?'color:var(--text-dim);text-decoration:line-through':''}">${m.title}</div><div class="milestone-date">${m.date}</div></div></div>`).join('');
}

function renderQuote(){const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];document.getElementById('quoteText').textContent=q.t;document.getElementById('quoteAuthor').textContent='—— '+q.a}

// ===== ACTIONS =====
function toggleGoal(id){const g=goals.find(x=>x.id===id);if(!g)return;g.completed=!g.completed;g.progress=g.completed?100:Math.min(g.progress,95);if(g.completed&&g.subtasks)g.subtasks.forEach(s=>s.d=true);saveGoals();render()}
function deleteGoal(id){if(!confirm('确定删除？'))return;goals=goals.filter(g=>g.id!==id);saveGoals();render()}
function editProgress(id){const g=goals.find(x=>x.id===id);if(!g)return;const v=prompt('进度 (0-100):',g.progress);if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0||n>100)return;g.progress=n;if(n===100){g.completed=true;if(g.subtasks)g.subtasks.forEach(s=>s.d=true)}else g.completed=false;saveGoals();render()}
function toggleSubtask(gid,si){const g=goals.find(x=>x.id===gid);if(!g?.subtasks)return;g.subtasks[si].d=!g.subtasks[si].d;const dc=g.subtasks.filter(s=>s.d).length;g.progress=Math.round(dc/g.subtasks.length*100);g.completed=g.progress===100;saveGoals();render()}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderMain()}
function selectPriority(el){document.querySelectorAll('#goalModal .form-tag-option').forEach(t=>t.classList.remove('selected'));el.classList.add('selected');selectedPriority=el.dataset.val}
function updateStreakCount(){const sd=ld('streak',{});let c=0;const t=new Date();for(let i=0;i<365;i++){const d=new Date(t);d.setDate(d.getDate()-i);if(sd[d.toISOString().slice(0,10)])c++;else break}document.getElementById('streakCount').textContent=c+' 天'}

function openModal(type){
  const id={goal:'goalModal',savings:'savingsModal',budget:'budgetModal',record:'recordModal',config:'configModal'}[type];
  document.getElementById(id).classList.add('show');
  if(type==='budget'){document.getElementById('budgetIncome').value=planConfig.monthlyIncome;document.getElementById('budgetFixed').value=planConfig.fixedExpenses}
  if(type==='config')openPlanConfig();
}
function closeModal(e,id){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('show')}

function addGoal(){
  const t=document.getElementById('goalTitle').value.trim();if(!t){alert('请输入名称');return}
  goals.unshift({id:Date.now(),title:t,desc:document.getElementById('goalDesc').value.trim(),category:document.getElementById('goalCategory').value,priority:selectedPriority,deadline:document.getElementById('goalDeadline').value,progress:0,completed:false,created:new Date().toISOString().slice(0,10),subtasks:[]});
  saveGoals();closeModal(null,'goalModal');document.getElementById('goalTitle').value='';document.getElementById('goalDesc').value='';document.getElementById('goalDeadline').value='';render();
}

function addSavingsGoal(){
  const n=document.getElementById('svName').value.trim(),t=parseInt(document.getElementById('svTarget').value);
  if(!n||!t){alert('请填写');return}
  const colors=['#e8a838','#3dd68c','#5b9cf5','#e87ab4','#9b7aed','#3dd6c8','#e85454','#f5c842'];
  savings.goals.push({id:Date.now(),name:n,icon:document.getElementById('svIcon').value,target:t,current:parseInt(document.getElementById('svCurrent').value)||0,deadline:document.getElementById('svDeadline').value,color:colors[savings.goals.length%colors.length]});
  saveSavings();closeModal(null,'savingsModal');document.getElementById('svName').value='';document.getElementById('svTarget').value='';document.getElementById('svCurrent').value='';render();
}

function deleteSavingsGoal(id){if(!confirm('确定？'))return;savings.goals=savings.goals.filter(g=>g.id!==id);saveSavings();render()}
function openRecordModal(gid){pendingRecordGoalId=gid;document.getElementById('recordAmount').value='';openModal('record')}
function confirmRecord(){
  const a=parseInt(document.getElementById('recordAmount').value);if(!a||a<=0){alert('请输入金额');return}
  const g=savings.goals.find(x=>x.id===pendingRecordGoalId);if(g)g.current=Math.min(g.target,g.current+a);
  const now=new Date(),mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!monthlyRecords[mk])monthlyRecords[mk]={income:planConfig.monthlyIncome,fixedExp:planConfig.fixedExpenses,variableExp:0,saved:0,target:Math.round((planConfig.monthlyIncome-planConfig.fixedExpenses)*planConfig.saveRate/100)};
  monthlyRecords[mk].saved+=a;
  sv('monthly',monthlyRecords);saveSavings();closeModal(null,'recordModal');render();
}

function saveBudget(){
  planConfig.monthlyIncome=parseInt(document.getElementById('budgetIncome').value)||0;
  planConfig.fixedExpenses=parseInt(document.getElementById('budgetFixed').value)||0;
  saveConfig();
  const now=new Date(),mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  if(!monthlyRecords[mk])monthlyRecords[mk]={income:planConfig.monthlyIncome,fixedExp:planConfig.fixedExpenses,variableExp:0,saved:0,target:Math.round((planConfig.monthlyIncome-planConfig.fixedExpenses)*planConfig.saveRate/100)};
  monthlyRecords[mk].income=planConfig.monthlyIncome;monthlyRecords[mk].fixedExp=planConfig.fixedExpenses;
  monthlyRecords[mk].variableExp=parseInt(document.getElementById('budgetVariable').value)||0;
  sv('monthly',monthlyRecords);closeModal(null,'budgetModal');render();
}

// ===== INIT =====
(function(){
  const now=new Date(),days=['日','一','二','三','四','五','六'];
  document.getElementById('headerDate').textContent=`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} 周${days[now.getDay()]}`;
  generateAllPlans();
  render();
})();
</script>
