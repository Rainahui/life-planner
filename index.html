<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生规划清单 — Life Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d0a;--surface:#0e1612;--surface-2:#152019;--surface-3:#1c2b23;--border:#253a2e;
  --accent:#10b981;--accent-hover:#34d399;--accent-dim:#059669;--accent-glow:rgba(16,185,129,.12);
  --green:#34d399;--gold:#f59e0b;--red:#ef6b6b;--purple:#a78bfa;--blue:#60a5fa;--pink:#f472b6;--teal:#2dd4bf;--orange:#fb923c;
  --text:#e2ede6;--text-mid:#8fa39a;--text-dim:#566960;
  --font-display:'Noto Serif SC',serif;--font-body:'Noto Sans SC',sans-serif;--font-mono:'Space Mono',monospace;
  --radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box}html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}::selection{background:rgba(16,185,129,.22);color:var(--accent-hover)}

.app{display:grid;grid-template-columns:260px 1fr 280px;grid-template-rows:auto 1fr;min-height:100vh}
.header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--surface);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:14px}
.logo{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));border-radius:10px;display:flex;align-items:center;justify-content:center;transition:transform .3s}.logo:hover{transform:rotate(12deg) scale(1.05)}
.logo svg{width:20px;height:20px}
.header-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700}
.header-subtitle{font-size:.68rem;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:.08em}
.header-right{display:flex;align-items:center;gap:10px}
.header-date{font-family:var(--font-mono);font-size:.75rem;color:var(--text-mid);padding:6px 14px;background:var(--surface-2);border-radius:var(--radius-sm);border:1px solid var(--border)}
.btn-add{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--accent);color:#080d0a;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .25s}.btn-add:hover{background:var(--accent-hover);transform:translateY(-1px)}

.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:20px 0;overflow-y:auto;height:calc(100vh - 65px);position:sticky;top:65px}
.sidebar-section{padding:0 18px;margin-bottom:24px}
.sidebar-label{font-family:var(--font-mono);font-size:.62rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.2em;margin-bottom:10px;padding-left:6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface-2)}.nav-item.active{background:var(--accent-glow);border-left-color:var(--accent)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.nav-item.active .nav-dot{box-shadow:0 0 8px var(--accent);transform:scale(1.3)}
.nav-text{font-size:.85rem;flex:1}.nav-count{font-family:var(--font-mono);font-size:.65rem;color:var(--text-dim);background:var(--surface-3);padding:2px 7px;border-radius:10px}
.sidebar-stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:0 18px 10px}
.sidebar-stat-label{font-size:.7rem;color:var(--text-dim);margin-bottom:4px}.sidebar-stat-value{font-family:var(--font-mono);font-size:1.5rem;font-weight:700;color:var(--accent)}.sidebar-stat-sub{font-size:.68rem;color:var(--text-dim);margin-top:3px;font-family:var(--font-mono)}

.main{padding:24px 28px;overflow-y:auto;height:calc(100vh - 65px)}
.main-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.main-title{font-family:var(--font-display);font-size:1.5rem;font-weight:700}
.main-filters{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 14px;font-size:.72rem;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;color:var(--text-mid);cursor:pointer;transition:all .2s}.filter-btn.active,.filter-btn:hover{background:var(--accent-glow);border-color:var(--accent-dim);color:var(--accent)}
.btn-outline{padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-mid);font-family:var(--font-body);font-size:.75rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:4px}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn{padding:9px 22px;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;border:none}.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#080d0a}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text-mid)}.btn-secondary:hover{border-color:var(--text-dim);color:var(--text)}
.btn-danger{background:rgba(239,107,107,.1);color:var(--red);border:1px solid rgba(239,107,107,.2)}.btn-danger:hover{background:rgba(239,107,107,.18)}
.btn-smart{display:flex;align-items:center;gap:6px;padding:7px 16px;background:linear-gradient(135deg,var(--accent-dim),var(--accent));color:#080d0a;border:none;border-radius:var(--radius-sm);font-family:var(--font-body);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .3s}.btn-smart:hover{transform:translateY(-2px)}

.right-panel{background:var(--surface);border-left:1px solid var(--border);padding:20px 18px;overflow-y:auto;height:calc(100vh - 65px);position:sticky;top:65px}
.panel-section{margin-bottom:24px}.panel-title{font-family:var(--font-mono);font-size:.62rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.2em;margin-bottom:14px}
.quote-card{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.quote-text{font-family:var(--font-display);font-size:.88rem;font-weight:300;line-height:1.7;color:var(--text-mid);margin-bottom:8px}.quote-author{font-size:.68rem;color:var(--text-dim);font-family:var(--font-mono)}

/* Goals page */
.goals-list{display:flex;flex-direction:column;gap:14px}
.goal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;transition:all .3s;animation:fadeUp .5s ease forwards;opacity:0;position:relative;overflow:hidden}
.goal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.goal-card:hover{transform:translateX(3px)}
.goal-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.goal-checkbox{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s cubic-bezier(.34,1.56,.64,1);margin-top:2px}.goal-checkbox:hover{border-color:var(--accent);background:var(--accent-glow);transform:scale(1.1)}.goal-checkbox.checked{background:var(--green);border-color:var(--green)}.goal-checkbox.checked svg{opacity:1}.goal-checkbox svg{opacity:0;transition:opacity .2s}
.goal-info{flex:1}.goal-title{font-size:.95rem;font-weight:500;line-height:1.5}.goal-card.completed .goal-title{text-decoration:line-through;color:var(--text-dim)}.goal-desc{font-size:.78rem;color:var(--text-mid)}
.goal-meta{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}.goal-tag{display:inline-flex;align-items:center;gap:4px;font-size:.68rem;padding:3px 10px;border-radius:12px;font-family:var(--font-mono)}
.goal-progress-wrap{flex:1;min-width:80px}.goal-progress-bar-bg{width:100%;height:3px;background:var(--surface-3);border-radius:2px;overflow:hidden}.goal-progress-bar-fill{height:100%;border-radius:2px;transition:width 1s ease}.goal-progress-text{font-size:.65rem;color:var(--text-dim);font-family:var(--font-mono);text-align:right}
.goal-actions{display:flex;gap:5px;opacity:0;transition:opacity .2s;margin-left:auto}.goal-card:hover .goal-actions{opacity:1}
.goal-action-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--text-dim)}.goal-action-btn:hover{border-color:var(--accent);color:var(--accent)}.goal-action-btn.delete:hover{border-color:var(--red);color:var(--red)}

/* Monthly page */
.monthly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-bottom:24px}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);animation:fadeUp .5s ease forwards;opacity:0;overflow:hidden}.month-card.current{border-color:var(--accent-dim)}.month-card.locked{border-color:var(--purple)}
.month-card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}.month-card-name{font-family:var(--font-mono);font-size:.85rem;font-weight:700}
.month-badge{font-size:.58rem;padding:2px 8px;border-radius:10px;font-family:var(--font-mono)}
.month-lock-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75rem;transition:all .2s}.month-lock-btn.on{background:rgba(167,139,250,.12);border-color:var(--purple);color:var(--purple)}
.month-card-body{padding:14px 18px}
.month-task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(37,58,46,.5)}.month-task:last-child{border-bottom:none}
.month-task-check{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s}.month-task-check:hover{border-color:var(--accent)}.month-task-check.done{background:var(--green);border-color:var(--green)}.month-task-check.done svg{opacity:1}.month-task-check svg{opacity:0}
.month-task-content{flex:1;min-width:0}.month-task-title{font-size:.76rem;color:var(--text-mid);cursor:pointer;padding:3px 6px;border-radius:4px;transition:all .15s}.month-task-title:hover{background:var(--surface-3);color:var(--text)}
.month-task-meta{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}.month-task-tag{font-size:.56rem;padding:1px 6px;border-radius:8px;font-family:var(--font-mono)}.month-task-val{font-size:.65rem;font-family:var(--font-mono);color:var(--accent);cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .15s}.month-task-val:hover{background:var(--accent-glow)}
.month-task-del{width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .15s;font-size:.7rem}.month-task:hover .month-task-del{opacity:1}.month-task-del:hover{color:var(--red)}
.month-add-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:7px;margin:6px 18px 14px;border:1px dashed var(--border);border-radius:var(--radius-sm);font-size:.7rem;color:var(--text-dim);cursor:pointer;transition:all .2s;background:transparent;width:calc(100% - 36px)}.month-add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.month-card-foot{padding:8px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-dim);font-family:var(--font-mono)}
.month-notes{padding:0 18px 10px}.month-notes textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text-mid);font-family:var(--font-body);font-size:.7rem;padding:7px 10px;resize:none;outline:none;min-height:34px}
.smart-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.smart-summary-card{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;text-align:center}.smart-summary-val{font-family:var(--font-mono);font-size:1.2rem;font-weight:700;margin-bottom:3px}.smart-summary-label{font-size:.65rem;color:var(--text-dim)}

/* ============ SAVINGS PAGE ============ */

/* Hero donut */
.sv-hero{display:grid;grid-template-columns:170px 1fr;gap:28px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 32px;margin-bottom:20px;align-items:center;animation:fadeUp .5s ease forwards;opacity:0;position:relative;overflow:hidden}
.sv-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--teal),var(--gold))}
.sv-donut-wrap{position:relative;width:150px;height:150px;justify-self:center}
.sv-donut-wrap svg{width:150px;height:150px;transform:rotate(-90deg)}
.sv-donut-bg{fill:none;stroke:var(--surface-3);stroke-width:10}
.sv-donut-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.22,1,.36,1)}
.sv-donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sv-donut-pct{font-family:var(--font-mono);font-size:1.8rem;font-weight:700;color:var(--accent)}
.sv-donut-label{font-size:.62rem;color:var(--text-dim);margin-top:2px}
.sv-hero-info{display:flex;flex-direction:column;gap:12px}
.sv-hero-title{font-family:var(--font-display);font-size:1.1rem;font-weight:700}
.sv-hero-metrics{display:flex;gap:20px;flex-wrap:wrap}
.sv-hero-metric-label{font-size:.62rem;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em}
.sv-hero-metric-val{font-family:var(--font-mono);font-size:1.15rem;font-weight:700}
.sv-hero-metric-sub{font-size:.6rem;color:var(--text-dim)}
.sv-hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}

/* KPI strip */
.sv-kpi{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.sv-kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;position:relative;overflow:hidden;transition:all .3s;animation:fadeUp .5s ease forwards;opacity:0}
.sv-kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.sv-kpi-card:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
.sv-kpi-icon{font-size:1.2rem;margin-bottom:6px}
.sv-kpi-label{font-size:.58rem;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.sv-kpi-val{font-family:var(--font-mono);font-size:1.05rem;font-weight:700}
.sv-kpi-sub{font-size:.58rem;color:var(--text-dim);margin-top:3px}

/* Flow diagram */
.sv-flow{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;animation:fadeUp .5s ease forwards;opacity:0}
.sv-flow-title{font-size:.85rem;font-weight:600;margin-bottom:3px}
.sv-flow-sub{font-size:.7rem;color:var(--text-dim);font-family:var(--font-mono);margin-bottom:16px}
.sv-flow-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:start}
.sv-flow-col-title{font-size:.62rem;color:var(--text-dim);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px;text-align:center}
.sv-flow-bar{padding:7px 12px;border-radius:6px;font-size:.72rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;transition:transform .2s}
.sv-flow-bar:hover{transform:scale(1.02)}
.sv-flow-bar-name{color:var(--text-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.sv-flow-bar-val{font-family:var(--font-mono);font-weight:600;white-space:nowrap}
.sv-flow-center{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:28px}
.sv-flow-total-box{padding:10px 16px;border-radius:8px;font-family:var(--font-mono);font-weight:700;text-align:center;font-size:.9rem;min-width:120px}
.sv-flow-arrow{color:var(--text-dim);font-size:1.2rem}

/* Savings goals */
.sv-goals-section{margin-bottom:20px}
.sv-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sv-section-title{font-family:var(--font-display);font-size:.92rem;font-weight:700;display:flex;align-items:center;gap:8px}
.sv-section-count{font-family:var(--font-mono);font-size:.62rem;color:var(--text-dim);background:var(--surface-3);padding:2px 8px;border-radius:10px}
.sv-goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.sv-goal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s;animation:fadeUp .5s ease forwards;opacity:0;position:relative}
.sv-goal:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.2)}
.sv-goal-accent{height:3px}
.sv-goal-top{padding:18px 20px 14px}
.sv-goal-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sv-goal-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.sv-goal-name{font-size:.88rem;font-weight:600;margin-bottom:2px}
.sv-goal-deadline{font-size:.62rem;color:var(--text-dim);font-family:var(--font-mono)}
.sv-goal-status{padding:3px 10px;border-radius:12px;font-size:.58rem;font-family:var(--font-mono);font-weight:600;flex-shrink:0}
.sv-goal-amounts{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.sv-goal-amounts-val{font-family:var(--font-mono);font-size:1.2rem;font-weight:700}
.sv-goal-amounts-target{font-family:var(--font-mono);font-size:.72rem;color:var(--text-dim)}
.sv-goal-bar-wrap{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:10px}
.sv-goal-bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.22,1,.36,1);position:relative}
.sv-goal-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15));border-radius:0 3px 3px 0}
.sv-goal-timeline{display:flex;align-items:center;gap:3px;margin-bottom:6px;padding:4px 0}
.sv-goal-tl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:all .2s}
.sv-goal-tl-dot.active{width:8px;height:8px;box-shadow:0 0 6px currentColor}
.sv-goal-tl-line{flex:1;height:1px;min-width:4px}
.sv-goal-tl-label{font-size:.58rem;color:var(--text-dim);font-family:var(--font-mono);margin-left:6px;white-space:nowrap}
.sv-goal-bottom{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:8px}
.sv-goal-monthly{font-size:.68rem;color:var(--text-dim);font-family:var(--font-mono)}
.sv-goal-monthly strong{color:var(--accent);font-weight:700}
.sv-goal-btns{display:flex;gap:6px}
.sv-goal-btn{padding:5px 12px;font-size:.68rem;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);color:var(--text-mid);cursor:pointer;transition:all .2s;font-family:var(--font-body);display:flex;align-items:center;gap:4px}.sv-goal-btn:hover{border-color:var(--accent);color:var(--accent)}.sv-goal-btn.primary{background:var(--accent-glow);border-color:rgba(16,185,129,.2);color:var(--accent)}.sv-goal-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* Trend chart */
.sv-trend{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;animation:fadeUp .5s ease forwards;opacity:0}
.sv-trend-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.sv-trend-title{font-size:.85rem;font-weight:600}.sv-trend-sub{font-size:.7rem;color:var(--text-dim);font-family:var(--font-mono);margin-top:2px}
.sv-trend-legend{display:flex;gap:14px}.sv-trend-legend-item{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--text-mid)}.sv-trend-legend-dot{width:8px;height:8px;border-radius:2px}
.sv-trend-chart{position:relative;height:180px;display:flex;align-items:flex-end;gap:6px;padding-bottom:30px;border-bottom:1px solid var(--border)}
.sv-trend-bar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;position:relative}
.sv-trend-bar{width:24px;border-radius:4px 4px 0 0;transition:height 1s cubic-bezier(.22,1,.36,1);min-height:2px;position:relative;cursor:pointer}
.sv-trend-bar:hover{filter:brightness(1.3)}
.sv-trend-bar-tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:.6rem;font-family:var(--font-mono);color:var(--text);white-space:nowrap;z-index:10}
.sv-trend-bar:hover .sv-trend-bar-tip{display:block}
.sv-trend-label{position:absolute;bottom:-22px;font-size:.58rem;color:var(--text-dim);font-family:var(--font-mono);white-space:nowrap}
.sv-trend-target-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--accent-dim);z-index:1}
.sv-trend-target-text{position:absolute;right:0;top:-14px;font-size:.52rem;font-family:var(--font-mono);color:var(--accent-dim);background:var(--surface);padding:0 4px}

/* FP Modal */
.fp-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fp-modal-grid .form-group{margin-bottom:10px}
.fp-modal-input{padding:8px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-mono);font-size:.82rem;outline:none;transition:all .25s;width:100%}.fp-modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.fp-modal-label{font-size:.75rem;color:var(--text-mid);margin-bottom:4px}
.fp-modal-sec{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border)}.fp-modal-sec:last-of-type{border-bottom:none}
.fp-modal-sec-title{font-size:.82rem;font-weight:600;margin-bottom:12px}
.fp-calc-preview{background:var(--surface-2);border:1px solid var(--accent-dim);border-radius:var(--radius);padding:14px;margin-top:14px}
.fp-calc-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.75rem;color:var(--text-mid)}.fp-calc-row.total{font-weight:700;color:var(--accent);font-size:.82rem;border-top:1px solid var(--border);padding-top:8px;margin-top:4px}.fp-calc-val{font-family:var(--font-mono)}

/* Modals generic */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;max-height:85vh;overflow-y:auto;animation:modalIn .3s ease;box-shadow:0 24px 64px rgba(0,0,0,.5)}
.modal-sm{max-width:440px}.modal-lg{max-width:720px}
.modal-header{padding:22px 26px 14px;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--border)}.modal-header .modal-close{position:absolute;top:22px;right:22px}
.modal-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700}.modal-desc{font-size:.8rem;color:var(--text-mid);margin-top:3px}
.modal-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;font-size:.75rem}.modal-close:hover{border-color:var(--red);color:var(--red)}
.modal-body{padding:22px 26px}.modal-footer{padding:14px 26px 22px;display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:16px}.form-label{display:block;font-size:.75rem;color:var(--text-mid);margin-bottom:5px;font-weight:500}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-body);font-size:.85rem;outline:none;transition:all .25s}.form-input:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}.form-textarea{resize:vertical;min-height:68px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-tags{display:flex;flex-wrap:wrap;gap:8px}
.form-tag-option{padding:5px 14px;border:1px solid var(--border);border-radius:20px;font-size:.75rem;cursor:pointer;transition:all .2s;color:var(--text-mid);background:var(--surface-2)}.form-tag-option.selected{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px}.confirm-overlay.show{display:flex}
.confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:360px;max-width:90vw;animation:modalIn .3s ease;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.5)}.confirm-title{font-family:var(--font-display);font-size:1.05rem;font-weight:700;text-align:center;margin-bottom:6px}.confirm-desc{font-size:.8rem;color:var(--text-mid);text-align:center;line-height:1.6;padding:0 26px}.confirm-footer{display:flex;gap:10px;padding:18px 26px 22px}.confirm-footer .btn{flex:1;justify-content:center;display:flex}
.toast-container{position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 18px;border-radius:var(--radius);font-size:.8rem;display:flex;align-items:center;gap:10px;animation:toastIn .4s ease forwards;pointer-events:auto;box-shadow:0 8px 32px rgba(0,0,0,.45);min-width:220px;max-width:380px}
.toast-success{background:var(--surface);border:1px solid rgba(52,211,153,.25);color:var(--green)}.toast-error{background:var(--surface);border:1px solid rgba(239,107,107,.25);color:var(--red)}.toast-info{background:var(--surface);border:1px solid rgba(96,165,250,.25);color:var(--blue)}
.toast-out{animation:toastOut .3s ease forwards}
.value-editor{display:flex;align-items:center;gap:10px;padding:14px;background:var(--surface-2);border-radius:var(--radius);border:2px solid var(--border);margin-bottom:14px;transition:border-color .25s}.value-editor:focus-within{border-color:var(--accent)}
.value-editor-input{flex:1;background:transparent;border:none;color:var(--accent);font-family:var(--font-mono);font-size:1.5rem;font-weight:700;outline:none}
.value-editor-unit{font-size:.85rem;color:var(--text-dim);font-family:var(--font-mono)}
.value-stepper{display:flex;gap:4px}.value-stepper button{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--surface-3);color:var(--text-mid);cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s}.value-stepper button:hover{border-color:var(--accent);color:var(--accent)}
.quick-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.quick-preset{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);font-size:.7rem;color:var(--text-dim);cursor:pointer;transition:all .2s;font-family:var(--font-mono)}.quick-preset:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
.add-task-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}.add-type-card{padding:18px 10px;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface-2);cursor:pointer;text-align:center;transition:all .25s}.add-type-card:hover{transform:translateY(-2px)}.add-type-card.selected{border-color:var(--accent);background:var(--accent-glow);transform:translateY(-2px)}
.add-type-icon{font-size:1.6rem;margin-bottom:6px}.add-type-title{font-size:.8rem;font-weight:600;margin-bottom:3px}.add-type-desc{font-size:.65rem;color:var(--text-dim)}
.config-income-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(37,58,46,.4)}.config-income-input{flex:1;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-mono);font-size:.75rem;outline:none}
.expense-row{display:flex;align-items:center;gap:8px;padding:5px 0}.expense-row input{padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:.75rem;outline:none}.expense-del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:.8rem;padding:4px}.expense-del:hover{color:var(--red)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(50px)}}

@media(max-width:1100px){.app{grid-template-columns:220px 1fr}.right-panel{display:none}}
@media(max-width:768px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:16px}.header{padding:14px}.sv-kpi{grid-template-columns:repeat(3,1fr)}.sv-flow-grid{grid-template-columns:1fr}.sv-goals-grid{grid-template-columns:1fr}.sv-hero{grid-template-columns:1fr;text-align:center}.sv-hero-metrics{justify-content:center}.sv-hero-actions{justify-content:center}}
</style>
</head>

<div class="modal-overlay" id="fpModal" onclick="closeModal(event,'fpModal')"><div class="modal modal-lg" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">💰 财务画像</div><div class="modal-desc">填写社保、收入和支出，系统自动计算存款计划</div><button class="modal-close" onclick="closeModal(null,'fpModal')">✕</button></div><div class="modal-body"><div class="fp-modal-sec"><div class="fp-modal-sec-title">🏥 五险一金（个人部分）</div><div class="form-group"><label class="fp-modal-label">缴费基数</label><input class="fp-modal-input" type="number" id="fpSiBase"></div><div class="fp-modal-grid"><div class="form-group"><label class="fp-modal-label">养老 8%</label><input class="fp-modal-input" type="number" id="fpPension" step="0.1"></div><div class="form-group"><label class="fp-modal-label">医疗 2%</label><input class="fp-modal-input" type="number" id="fpMedical" step="0.1"></div><div class="form-group"><label class="fp-modal-label">失业 0.5%</label><input class="fp-modal-input" type="number" id="fpUnemploy" step="0.1"></div><div class="form-group"><label class="fp-modal-label">公积金 5-12%</label><input class="fp-modal-input" type="number" id="fpHousing" step="0.1"></div></div></div><div class="fp-modal-sec"><div class="fp-modal-sec-title">💵 收入明细（月均）</div><div class="fp-modal-grid"><div class="form-group"><label class="fp-modal-label">💼 基本工资（税前）</label><input class="fp-modal-input" type="number" id="fpSalary"></div><div class="form-group"><label class="fp-modal-label">🎯 绩效奖金</label><input class="fp-modal-input" type="number" id="fpBonus"></div><div class="form-group"><label class="fp-modal-label">💻 副业/兼职</label><input class="fp-modal-input" type="number" id="fpFreelance"></div><div class="form-group"><label class="fp-modal-label">📈 投资收益</label><input class="fp-modal-input" type="number" id="fpInvest"></div><div class="form-group"><label class="fp-modal-label">📌 其他收入</label><input class="fp-modal-input" type="number" id="fpOtherIn"></div></div></div><div class="fp-modal-sec"><div class="fp-modal-sec-title">🏠 支出明细（月均）</div><div class="fp-modal-grid"><div class="form-group"><label class="fp-modal-label">🏠 房租/房贷</label><input class="fp-modal-input" type="number" id="fpRent"></div><div class="form-group"><label class="fp-modal-label">💡 水电燃气</label><input class="fp-modal-input" type="number" id="fpUtilities"></div><div class="form-group"><label class="fp-modal-label">📱 通讯</label><input class="fp-modal-input" type="number" id="fpInternet"></div><div class="form-group"><label class="fp-modal-label">🍜 餐饮</label><input class="fp-modal-input" type="number" id="fpFood"></div><div class="form-group"><label class="fp-modal-label">🚇 交通</label><input class="fp-modal-input" type="number" id="fpTransport"></div><div class="form-group"><label class="fp-modal-label">🎬 娱乐</label><input class="fp-modal-input" type="number" id="fpEntertain"></div><div class="form-group"><label class="fp-modal-label">👕 购物</label><input class="fp-modal-input" type="number" id="fpShopping"></div><div class="form-group"><label class="fp-modal-label">📚 学习</label><input class="fp-modal-input" type="number" id="fpEdu"></div><div class="form-group"><label class="fp-modal-label">💊 医疗</label><input class="fp-modal-input" type="number" id="fpHealth"></div><div class="form-group"><label class="fp-modal-label">📦 其他</label><input class="fp-modal-input" type="number" id="fpOtherEx"></div></div></div><div class="fp-calc-preview" id="fpCalcPreview"></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'fpModal')">取消</button><button class="btn btn-primary" onclick="saveFinancialProfile()">保存并更新</button></div></div></div>

<div class="modal-overlay" id="goalModal" onclick="closeModal(event,'goalModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">新建目标</div><button class="modal-close" onclick="closeModal(null,'goalModal')">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">名称</label><input class="form-input" id="goalTitle" maxlength="50"></div><div class="form-group"><label class="form-label">描述</label><textarea class="form-textarea" id="goalDesc"></textarea></div><div class="form-row"><div class="form-group"><label class="form-label">维度</label><select class="form-select" id="goalCategory"><option value="career">💼 职业</option><option value="health">🏃 健康</option><option value="finance">💰 财务</option><option value="learn">📚 学习</option><option value="social">🤝 社交</option><option value="family">🏠 家庭</option><option value="hobby">🎨 爱好</option><option value="spirit">🧘 心灵</option></select></div><div class="form-group"><label class="form-label">截止</label><input class="form-input" type="date" id="goalDeadline"></div></div><div class="form-group"><label class="form-label">优先级</label><div class="form-tags"><div class="form-tag-option" data-val="high" onclick="selectPriority(this)">🔴 紧急</div><div class="form-tag-option selected" data-val="mid" onclick="selectPriority(this)">🟡 重要</div><div class="form-tag-option" data-val="low" onclick="selectPriority(this)">🔵 一般</div></div></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'goalModal')">取消</button><button class="btn btn-primary" onclick="addGoal()">创建</button></div></div></div>

<div class="modal-overlay" id="recordModal" onclick="closeModal(event,'recordModal')"><div class="modal modal-sm" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">💳 记录存款</div><button class="modal-close" onclick="closeModal(null,'recordModal')">✕</button></div><div class="modal-body"><div class="value-editor"><span class="value-editor-unit">¥</span><input class="value-editor-input" type="number" id="recordAmount" placeholder="0" step="100"><div class="value-stepper"><button onclick="stepVal('recordAmount',-1000)">−</button><button onclick="stepVal('recordAmount',1000)">+</button></div></div><div class="quick-presets"><span class="quick-preset" onclick="setVal('recordAmount',500)">¥500</span><span class="quick-preset" onclick="setVal('recordAmount',1000)">¥1,000</span><span class="quick-preset" onclick="setVal('recordAmount',2000)">¥2,000</span><span class="quick-preset" onclick="setVal('recordAmount',5000)">¥5,000</span><span class="quick-preset" onclick="setVal('recordAmount',10000)">¥10,000</span></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'recordModal')">取消</button><button class="btn btn-primary" onclick="confirmRecord()">确认</button></div></div></div>

<div class="modal-overlay edit-task-modal" id="editTaskModal" onclick="closeModal(event,'editTaskModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title" id="editTaskTitle">编辑</div><button class="modal-close" onclick="closeModal(null,'editTaskModal')">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">名称</label><input class="form-input" id="editName"></div><div id="editValueSection"><div class="form-group"><label class="form-label" id="editValueLabel">百分比</label><div class="value-editor"><input class="value-editor-input" type="number" id="editValue" min="0"><span class="value-editor-unit" id="editValUnit">%</span><div class="value-stepper"><button onclick="stepVal('editValue',-5)">−</button><button onclick="stepVal('editValue',5)">+</button></div></div><div class="quick-presets" id="editPresets"></div></div></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'editTaskModal')">取消</button><button class="btn btn-primary" onclick="saveEditTask()">保存</button></div></div></div>

<div class="modal-overlay" id="addTaskModal" onclick="closeModal(event,'addTaskModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">添加任务</div><button class="modal-close" onclick="closeModal(null,'addTaskModal')">✕</button></div><div class="modal-body"><div class="add-task-types" id="addTypeCards"><div class="add-type-card selected" data-type="goal" onclick="selectAddType(this)"><div class="add-type-icon">🎯</div><div class="add-type-title">目标</div><div class="add-type-desc">百分比</div></div><div class="add-type-card" data-type="saving" onclick="selectAddType(this)"><div class="add-type-icon">💰</div><div class="add-type-title">存款</div><div class="add-type-desc">金额</div></div><div class="add-type-card" data-type="habit" onclick="selectAddType(this)"><div class="add-type-icon">🔄</div><div class="add-type-title">习惯</div><div class="add-type-desc">持续</div></div></div><div class="form-group"><label class="form-label">名称</label><input class="form-input" id="addTaskName"></div><div id="addValueSection"><div class="form-group"><label class="form-label" id="addValueLabel">百分比</label><div class="value-editor"><input class="value-editor-input" type="number" id="addValue" min="0"><span class="value-editor-unit" id="addValUnit">%</span><div class="value-stepper"><button onclick="stepVal('addValue',-5)">−</button><button onclick="stepVal('addValue',5)">+</button></div></div><div class="quick-presets" id="addPresets"></div></div></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'addTaskModal')">取消</button><button class="btn btn-primary" onclick="saveAddTask()">添加</button></div></div></div>

<div class="modal-overlay" id="configModal" onclick="closeModal(event,'configModal')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-header"><div class="modal-title">⚙️ 配置</div><button class="modal-close" onclick="closeModal(null,'configModal')">✕</button></div><div class="modal-body"><div class="form-group"><label class="form-label">月收入</label><input class="form-input" type="number" id="cfgIncome"></div><div class="form-group"><label class="form-label">固定支出</label><input class="form-input" type="number" id="cfgFixed"></div><div class="form-group"><label class="form-label">储蓄率 %</label><input class="form-input" type="number" id="cfgSaveRate" min="0" max="100"></div><div class="form-group"><label class="form-label">月收入变动</label><div id="cfgIncomeOverrides"></div><button class="btn-outline" style="margin-top:8px" onclick="addIncomeOverride()">+ 添加</button></div><div class="form-group"><label class="form-label">大额支出</label><div id="cfgExpenses"></div><button class="btn-outline" style="margin-top:8px" onclick="addCfgExpense()">+ 添加</button></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal(null,'configModal')">取消</button><button class="btn btn-primary" onclick="savePlanConfig()">保存</button></div></div></div>

<script>
const CATS=[{id:'all',label:'全部',icon:'',color:'var(--accent)'},{id:'career',label:'职业发展',icon:'💼',color:'#10b981'},{id:'health',label:'健康',icon:'🏃',color:'#34d399'},{id:'finance',label:'财务',icon:'💰',color:'#f59e0b'},{id:'learn',label:'学习',icon:'📚',color:'#60a5fa'},{id:'social',label:'社交',icon:'🤝',color:'#f472b6'},{id:'family',label:'家庭',icon:'🏠',color:'#2dd4bf'},{id:'hobby',label:'爱好',icon:'🎨',color:'#a78bfa'},{id:'spirit',label:'心灵',icon:'🧘',color:'#ef6b6b'}];
const MN=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const QUOTES=[{t:'设计不是外表的感觉，设计是事物运作的方式。',a:'Steve Jobs'},{t:'好的设计是尽可能少的设计。',a:'Dieter Rams'},{t:'简洁是复杂的最高境界。',a:'Leonardo da Vinci'},{t:'不积跬步，无以至千里。',a:'荀子'}];
let currentView='all',currentFilter='all',selectedPriority='mid',pendingRecordGoalId=null,confirmCb=null,addTaskTargetKey=null,editTaskCtx=null;

function ld(k,d){try{const v=localStorage.getItem('lp_'+k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem('lp_'+k,JSON.stringify(v))}catch(e){}}
function $(id){return document.getElementById(id)}
function fmt(n){return'¥'+(n||0).toLocaleString()}
function toast(msg,type='success'){const c=$('toastContainer');const el=document.createElement('div');el.className='toast toast-'+type;el.innerHTML='<span style="font-size:1rem">'+({success:'✓',error:'✕',info:'ℹ'}[type]||'')+'</span><span style="flex:1">'+msg+'</span>';c.appendChild(el);setTimeout(()=>{el.classList.add('toast-out');setTimeout(()=>el.remove(),300)},3000)}
function showConfirm(t,d,cb){$('confirmTitle').textContent=t;$('confirmDesc').textContent=d;confirmCb=cb;$('confirmOverlay').classList.add('show')}
function closeConfirm(){$('confirmOverlay').classList.remove('show');confirmCb=null}
function confirmAction(){if(confirmCb)confirmCb();closeConfirm()}
function stepVal(id,s){$(id).value=Math.max(0,(parseInt($(id).value)||0)+s)}
function setVal(id,v){$(id).value=v}
function selectPriority(el){document.querySelectorAll('#goalModal .form-tag-option').forEach(t=>t.classList.remove('selected'));el.classList.add('selected');selectedPriority=el.dataset.val}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){for(const id of['confirmOverlay','addTaskModal','editTaskModal','configModal','recordModal','savingsModal','goalModal','fpModal']){if($(id).classList.contains('show')){$(id).classList.remove('show');if(confirmCb)closeConfirm();return}}}});

// Data
let goals=ld('goals',[{id:1,title:'重构作品集',desc:'Framer 重建',category:'career',priority:'high',deadline:'2026-09-30',progress:15,completed:false,created:'2026-08-01',subtasks:[{t:'素材',d:true},{t:'结构',d:false},{t:'设计',d:false}]},{id:2,title:'Design System',desc:'组件库',category:'career',priority:'high',deadline:'2026-12-31',progress:10,completed:false,created:'2026-08-01',subtasks:[{t:'Audit',d:true},{t:'Token',d:false}]},{id:3,title:'动效设计',desc:'AE/Rive',category:'learn',priority:'high',deadline:'2026-11-30',progress:20,completed:false,created:'2026-06-01',subtasks:[{t:'AE',d:true},{t:'Rive',d:false}]},{id:4,title:'3D 设计',desc:'Spline',category:'learn',priority:'mid',deadline:'2027-02-28',progress:5,completed:false,created:'2026-08-01',subtasks:[]},{id:5,title:'设计影响力',desc:'个人品牌',category:'social',priority:'mid',deadline:'2026-12-31',progress:10,completed:false,created:'2026-08-01',subtasks:[]},{id:6,title:'体态矫正',desc:'久坐防治',category:'health',priority:'high',deadline:'',progress:25,completed:false,created:'2026-08-01',subtasks:[{t:'升降桌',d:true},{t:'拉伸',d:false}]},{id:7,title:'储蓄20万',desc:'28岁前',category:'finance',priority:'mid',deadline:'2027-06-30',progress:35,completed:false,created:'2026-01-01',subtasks:[]},{id:8,title:'设计理论',desc:'经典书',category:'learn',priority:'mid',deadline:'2027-06-30',progress:20,completed:false,created:'2026-01-01',subtasks:[]}]);
let savings=ld('savings',{goals:[{id:1,name:'应急基金',icon:'🛡️',target:80000,current:28000,deadline:'2026-12',color:'#10b981'},{id:2,name:'MacBook',icon:'💻',target:25000,current:6000,deadline:'2027-03',color:'#60a5fa'},{id:3,name:'课程投资',icon:'🎓',target:12000,current:3000,deadline:'2027-06',color:'#a78bfa'},{id:4,name:'旅行基金',icon:'✈️',target:15000,current:4000,deadline:'2026-10',color:'#34d399'}]});
let fp=ld('fp',{siBase:15000,si:{pension:8,medical:2,unemploy:0.5,housing:12},income:{salary:18000,bonus:2000,freelance:2000,invest:0,other:0},expense:{rent:3500,utilities:200,internet:100,food:1500,transport:300,entertain:500,shopping:500,education:300,health:200,other:200}});
let planConfig=ld('planConfig',{monthlyIncome:20000,fixedExpenses:7000,saveRate:45,availableHours:12,incomeOverrides:{1:28000},futureExpenses:[{month:'2026-09',name:'设计大会',amount:2000},{month:'2026-10',name:'旅行',amount:6000}],adaptiveMode:true});
let monthlyPlans=ld('monthlyPlans',{}),monthlyRecords=ld('monthly',{});
function saveAll(){sv('goals',goals);sv('savings',savings);sv('fp',fp);sv('planConfig',planConfig);sv('monthlyPlans',monthlyPlans);sv('monthly',monthlyRecords)}

function getFS(){if(!fp)return null;const sr=(fp.si.pension+fp.si.medical+fp.si.unemploy+fp.si.housing)/100;const siD=Math.round(fp.siBase*sr);const hf=Math.round(fp.siBase*fp.si.housing/100*2);const ns=fp.income.salary-siD;const ti=ns+fp.income.bonus+fp.income.freelance+fp.income.invest+fp.income.other;const fe=fp.expense.rent+fp.expense.utilities+fp.expense.internet;const ve=fp.expense.food+fp.expense.transport+fp.expense.entertain+fp.expense.shopping+fp.expense.education+fp.expense.health+fp.expense.other;const te=fe+ve;return{gross:fp.income.salary,siD,hf,ns,ti,fe,ve,te,disp:ti-te,st:Math.round((ti-te)*planConfig.saveRate/100)}}
function syncCfg(){const s=getFS();if(s){planConfig.monthlyIncome=s.ti;planConfig.fixedExpenses=s.te;saveAll()}}
function getMI(k){const mo=planConfig.incomeOverrides[parseInt(k.split('-')[1])];if(mo)return mo;const s=getFS();return s?s.ti:planConfig.monthlyIncome}
function getME(k){return planConfig.futureExpenses.filter(e=>e.month===k).reduce((s,e)=>s+e.amount,0)}
function getHR(){const ks=Object.keys(monthlyRecords).sort().slice(-3);if(!ks.length)return.75;let tt=0,td=0;ks.forEach(k=>{const r=monthlyRecords[k];if(r){tt+=r.target||0;td+=r.saved||0}});return tt>0?Math.min(1,td/tt):.75}

// FP Modal
function openFPModal(){$('fpSiBase').value=fp.siBase||'';$('fpPension').value=fp.si.pension||'';$('fpMedical').value=fp.si.medical||'';$('fpUnemploy').value=fp.si.unemploy||'';$('fpHousing').value=fp.si.housing||'';$('fpSalary').value=fp.income.salary||'';$('fpBonus').value=fp.income.bonus||'';$('fpFreelance').value=fp.income.freelance||'';$('fpInvest').value=fp.income.invest||'';$('fpOtherIn').value=fp.income.other||'';$('fpRent').value=fp.expense.rent||'';$('fpUtilities').value=fp.expense.utilities||'';$('fpInternet').value=fp.expense.internet||'';$('fpFood').value=fp.expense.food||'';$('fpTransport').value=fp.expense.transport||'';$('fpEntertain').value=fp.expense.entertain||'';$('fpShopping').value=fp.expense.shopping||'';$('fpEdu').value=fp.expense.education||'';$('fpHealth').value=fp.expense.health||'';$('fpOtherEx').value=fp.expense.other||'';updateFPCalc();$('fpModal').classList.add('show');document.querySelectorAll('#fpModal .fp-modal-input').forEach(el=>{el.oninput=updateFPCalc})}
function readFPInputs(){const g=id=>parseInt($(id).value)||0;return{siBase:g('fpSiBase'),si:{pension:g('fpPension'),medical:g('fpMedical'),unemploy:g('fpUnemploy'),housing:g('fpHousing')},income:{salary:g('fpSalary'),bonus:g('fpBonus'),freelance:g('fpFreelance'),invest:g('fpInvest'),other:g('fpOtherIn')},expense:{rent:g('fpRent'),utilities:g('fpUtilities'),internet:g('fpInternet'),food:g('fpFood'),transport:g('fpTransport'),entertain:g('fpEntertain'),shopping:g('fpShopping'),education:g('fpEdu'),health:g('fpHealth'),other:g('fpOtherEx')}}}
function calcFP(fp2){const sr=(fp2.si.pension+fp2.si.medical+fp2.si.unemploy+fp2.si.housing)/100;const sd=Math.round(fp2.siBase*sr);const net=fp2.income.salary-sd;const ti=net+fp2.income.bonus+fp2.income.freelance+fp2.income.invest+fp2.income.other;const te=fp2.expense.rent+fp2.expense.utilities+fp2.expense.internet+fp2.expense.food+fp2.expense.transport+fp2.expense.entertain+fp2.expense.shopping+fp2.expense.education+fp2.expense.health+fp2.expense.other;return{sd,net,ti,te,disp:ti-te,st:Math.round((ti-te)*planConfig.saveRate/100)}}
function updateFPCalc(){const c=calcFP(readFPInputs());$('fpCalcPreview').innerHTML='<div class="fp-calc-row"><span>五险一金扣除</span><span class="fp-calc-val" style="color:var(--red)">-'+fmt(c.sd)+'</span></div><div class="fp-calc-row"><span>税后工资</span><span class="fp-calc-val">'+fmt(c.net)+'</span></div><div class="fp-calc-row total"><span>月总收入</span><span class="fp-calc-val">'+fmt(c.ti)+'</span></div><div class="fp-calc-row"><span>月总支出</span><span class="fp-calc-val" style="color:var(--gold)">-'+fmt(c.te)+'</span></div><div class="fp-calc-row total"><span>月结余</span><span class="fp-calc-val" style="color:'+(c.disp>=0?'var(--accent)':'var(--red)')+'">'+fmt(c.disp)+'</span></div>'+(c.disp<0?'<div style="color:var(--red);font-size:.72rem;margin-top:6px;text-align:center">⚠️ 支出超过收入</div>':'')}
function saveFinancialProfile(){fp=readFPInputs();syncCfg();Object.keys(monthlyPlans).forEach(k=>{if(!monthlyPlans[k].locked)delete monthlyPlans[k]});closeModal(null,'fpModal');toast('财务画像已保存');render()}

// Plan Generation
function generateAll(force){const now=new Date();for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(monthlyPlans[key]?.locked)continue;if(!force&&monthlyPlans[key]?.tasks?.length>0)continue;const tasks=[];const inc=getMI(key);const extra=getME(key);const avail=Math.max(0,inc-planConfig.fixedExpenses-extra);const sb=Math.round(avail*planConfig.saveRate/100);const active=goals.filter(g=>!g.completed);const tw=active.reduce((s,g)=>{const pw={high:2,mid:1.2,low:.7}[g.priority]||1;const urg=g.deadline?Math.max(.5,1/Math.max(1,Math.ceil((new Date(g.deadline)-now)/2592e5))):.3;return s+pw*urg},0)||1;active.forEach(g=>{const rem=100-g.progress;if(rem<=0)return;const dl=g.deadline?new Date(g.deadline):new Date(now.getFullYear()+1,11,31);const ml=Math.max(1,Math.ceil((dl-d)/2592e5));const pw={high:2,mid:1.2,low:.7}[g.priority]||1;const urg=g.deadline?Math.max(.5,1/Math.max(1,Math.ceil((dl-d)/2592e5))):.3;let rp=Math.ceil(rem/ml*(pw*urg/tw)*active.length);if(planConfig.adaptiveMode&&i>0){const hr=getHR();if(hr<.7)rp=Math.round(rp*hr)}rp=Math.max(2,Math.min(rem,rp));const ci=CATS.find(c=>c.id===g.category);tasks.push({id:'g'+g.id+'_'+key,goalId:g.id,type:'goal',title:g.title,pct:rp,amount:0,done:false,auto:true,color:ci?.color||'var(--accent)',icon:ci?.icon||'📌'})});const svg=savings.goals.filter(g=>g.target>g.current);svg.forEach(g=>{const rem=g.target-g.current;if(rem<=0)return;const dl=g.deadline?new Date(g.deadline+'-01'):new Date(now.getFullYear()+2,0,1);const ml=Math.max(1,Math.ceil((dl-d)/2592e5));const fa=Math.min(rem,Math.max(100,Math.ceil(sb/Math.max(1,svg.length))));tasks.push({id:'s'+g.id+'_'+key,type:'saving',title:'存入 '+g.name,pct:0,amount:fa,done:false,auto:true,color:g.color,icon:g.icon})});const manual=(force&&monthlyPlans[key]?.tasks)?monthlyPlans[key].tasks.filter(t=>!t.auto):[];monthlyPlans[key]={locked:false,notes:monthlyPlans[key]?.notes||'',tasks:[...tasks,...manual]}}saveAll()}

// ====== RENDER ======
function render(){renderNav();renderToolNav();renderMain();$('totalRate').textContent=(goals.length?Math.round(goals.filter(g=>g.completed).length/goals.length*100):0)+'%';$('totalSub').textContent=goals.filter(g=>g.completed).length+'/'+goals.length;const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];$('quoteText').textContent=q.t;$('quoteAuthor').textContent='—— '+q.a}

function renderNav(){$('navList').innerHTML=CATS.map(cat=>{const cnt=cat.id==='all'?goals.length:goals.filter(g=>g.category===cat.id).length;return'<div class="nav-item'+(currentView===cat.id?' active':'')+'" onclick="currentView=\''+cat.id+'\';currentFilter=\'all\';showBtn(\'goal\',\'新建目标\');render()"><div class="nav-dot" style="background:'+cat.color+'"></div><span class="nav-text">'+(cat.icon?cat.icon+' ':'')+cat.label+'</span><span class="nav-count">'+cnt+'</span></div>'}).join('')}
function renderToolNav(){$('toolNav').innerHTML=[{id:'savings',label:'存款计划',icon:'💰',color:'#f59e0b'},{id:'monthly',label:'月度规划',icon:'📅',color:'var(--accent)'}].map(t=>'<div class="nav-item'+(currentView===t.id?' active':'')+'" onclick="currentView=\''+t.id+'\';'+(t.id==='savings'?"showBtn('savings','添加存款')":"hideBtn()")+';render()"><div class="nav-dot" style="background:'+t.color+'"></div><span class="nav-text">'+t.icon+' '+t.label+'</span></div>').join('')}
function showBtn(t,l){const b=$('btnAddMain');b.style.display='';b.onclick=()=>openModal(t);b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> '+l}
function hideBtn(){$('btnAddMain').style.display='none'}
function renderMain(){const m=$('mainContent');if(currentView==='savings')renderSavingsView(m);else if(currentView==='monthly')renderMonthlyView(m);else renderGoalsView(m)}

function renderGoalsView(c){let f=currentView==='all'?[...goals]:goals.filter(g=>g.category===currentView);if(currentFilter==='active')f=f.filter(g=>!g.completed);if(currentFilter==='done')f=f.filter(g=>g.completed);const pr={high:0,mid:1,low:2};f.sort((a,b)=>{if(a.completed!==b.completed)return a.completed?1:-1;return(pr[a.priority]||1)-(pr[b.priority]||1)});const cat=CATS.find(c=>c.id===currentView);let h='<div class="main-header"><div class="main-title">'+(cat?cat.icon+' '+cat.label:'全部')+'</div><div class="main-filters"><button class="filter-btn'+(currentFilter==='all'?' active':'')+'" onclick="setFilter(\'all\',this)">全部</button><button class="filter-btn'+(currentFilter==='active'?' active':'')+'" onclick="setFilter(\'active\',this)">进行中</button><button class="filter-btn'+(currentFilter==='done'?' active':'')+'" onclick="setFilter(\'done\',this)">已完成</button></div></div>';if(!f.length){h+='<div style="text-align:center;padding:50px;color:var(--text-dim)">暂无</div>';c.innerHTML=h;return}h+='<div class="goals-list">';f.forEach((g,i)=>{const ci=CATS.find(c=>c.id===g.category);const pb={high:'rgba(239,107,107,.1)',mid:'rgba(245,158,11,.1)',low:'rgba(96,165,250,.1)'};const pc={high:'var(--red)',mid:'var(--gold)',low:'var(--blue)'};h+='<div class="goal-card'+(g.completed?' completed':'')+'" style="animation-delay:'+i*.07+'s"><style>.goal-card:nth-child('+(i+1)+')::before{background:'+ci.color+'}</style><div class="goal-card-top"><div class="goal-checkbox'+(g.completed?' checked':'')+'" onclick="toggleGoal('+g.id+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#080d0a" stroke-width="3"><polyline points="4 12 9 17 20 6"/></svg></div><div class="goal-info"><div class="goal-title">'+g.title+'</div>'+(g.desc?'<div class="goal-desc">'+g.desc+'</div>':'')+'</div><div class="goal-actions"><button class="goal-action-btn delete" onclick="deleteGoal('+g.id+')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6V20a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg></button></div></div><div class="goal-meta"><span class="goal-tag" style="background:'+pb[g.priority]+';color:'+pc[g.priority]+'">'+({high:'🔴',mid:'🟡',low:'🔵'}[g.priority])+'</span><span class="goal-tag" style="background:'+ci.color+'18;color:'+ci.color+'">'+ci.icon+' '+ci.label+'</span>'+(g.deadline?'<span style="font-size:.7rem;color:var(--text-dim);font-family:var(--font-mono)">⏰ '+g.deadline+'</span>':'')+'<div class="goal-progress-wrap"><div class="goal-progress-text">'+g.progress+'%</div><div class="goal-progress-bar-bg"><div class="goal-progress-bar-fill" style="width:'+g.progress+'%;background:'+(g.completed?'var(--green)':ci.color)+'"></div></div></div></div></div>'});h+='</div>';c.innerHTML=h}

  const incItems=[{n:'税后工资',v:s.ns,c:'var(--green)'},{n:'奖金',v:fp.income.bonus,c:'var(--teal)'},{n:'副业',v:fp.income.freelance,c:'var(--accent)'},{n:'投资',v:fp.income.invest,c:'var(--blue)'},{n:'其他',v:fp.income.other,c:'var(--text-dim)'}].filter(x=>x.v>0);
  const expItems=[{n:'房租',v:fp.expense.rent,c:'var(--red)'},{n:'餐饮',v:fp.expense.food,c:'var(--orange)'},{n:'娱乐',v:fp.expense.entertain,c:'var(--purple)'},{n:'购物',v:fp.expense.shopping,c:'var(--pink)'},{n:'学习',v:fp.expense.education,c:'var(--blue)'},{n:'交通',v:fp.expense.transport,c:'var(--gold)'},{n:'居住',v:fp.expense.utilities+fp.expense.internet,c:'var(--teal)'},{n:'医疗',v:fp.expense.health,c:'var(--green)'},{n:'其他',v:fp.expense.other,c:'var(--text-dim)'}].filter(x=>x.v>0);

  // Left: income
  h+='<div><div class="sv-flow-col-title">收入构成</div>';
  incItems.forEach(x=>{h+='<div class="sv-flow-bar" style="background:'+x.c+'14;border-left:3px solid '+x.c+'"><span class="sv-flow-bar-name">'+x.n+'</span><span class="sv-flow-bar-val" style="color:'+x.c+'">'+fmt(x.v)+'</span></div>'});
  h+='</div>';

  // Center: totals
  h+='<div class="sv-flow-center">';
  h+='<div class="sv-flow-total-box" style="background:var(--accent-glow);color:var(--accent);border:1px solid rgba(16,185,129,.15)">'+fmt(s.ti)+'</div>';

  h+='<div class="sv-flow-total-box" style="background:rgba(245,158,11,.08);color:var(--gold);border:1px solid rgba(245,158,11,.12)">-'+fmt(s.te)+'</div>';
  h+='<div class="sv-flow-arrow">↓</div>';
  h+='<div class="sv-flow-total-box" style="background:'+(s.disp>=0?'rgba(16,185,129,.12)':'rgba(239,107,107,.12)')+';color:'+(s.disp>=0?'var(--accent)':'var(--red)')+';border:1px solid '+(s.disp>=0?'rgba(16,185,129,.15)':'rgba(239,107,107,.15)')+'">'+fmt(s.disp)+'</div>';
  h+='</div>';

  // Right: expenses
  h+='<div><div class="sv-flow-col-title">支出构成</div>';
  expItems.forEach(x=>{h+='<div class="sv-flow-bar" style="background:'+x.c+'14;border-left:3px solid '+x.c+'"><span class="sv-flow-bar-name">'+x.n+'</span><span class="sv-flow-bar-val" style="color:'+x.c+'">'+fmt(x.v)+'</span></div>'});
  h+='</div>';

  h+='</div></div>';

  // === SAVINGS GOALS ===
  h+=buildGoalsSection();

  // === TREND CHART ===
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}
  const tpm=s.st;const maxV=Math.max(tpm*1.5,...months.map(m=>(monthlyRecords[m]||{}).saved||0),5000);
  const tBtm=Math.round(tpm/maxV*150)+30;

  h+='<div class="sv-trend"><div class="sv-trend-header"><div><div class="sv-trend-title">📈 月度储蓄趋势</div><div class="sv-trend-sub">近6个月 · 目标 '+fmt(tpm)+'/月</div></div><div class="sv-trend-legend"><div class="sv-trend-legend-item"><div class="sv-trend-legend-dot" style="background:var(--accent)"></div>实际</div><div class="sv-trend-legend-item"><div class="sv-trend-legend-dot" style="background:var(--gold);opacity:.5"></div>目标</div></div></div>';
  h+='<div class="sv-trend-chart">';
  h+='<div class="sv-trend-target-line" style="bottom:'+tBtm+'px"><span class="sv-trend-target-text">'+fmt(tpm)+'</span></div>';
  months.forEach((m,i)=>{const rec=monthlyRecords[m];const act=rec?rec.saved:0;const bh=Math.max(3,act/maxV*150);const hit=act>=tpm;h+='<div class="sv-trend-bar-group"><div class="sv-trend-bar" style="height:'+bh+'px;background:'+(hit?'var(--accent)':'var(--gold)')+';opacity:'+(act>0?'1':'.25')+'"><div class="sv-trend-bar-tip">'+m.slice(5)+'月 · '+fmt(act)+'</div></div><span class="sv-trend-label">'+m.slice(5)+'月</span></div>'});
  h+='</div></div>';

  c.innerHTML=h;
}

function kpiCard(i,icon,label,val,color,sub){
  return '<div class="sv-kpi-card" style="animation-delay:'+(i*.06)+'s"><style>.sv-kpi-card:nth-child('+(i+1)+')::before{background:'+color+'}</style><div class="sv-kpi-icon">'+icon+'</div><div class="sv-kpi-label">'+label+'</div><div class="sv-kpi-val" style="color:'+color+'">'+val+'</div><div class="sv-kpi-sub">'+sub+'</div></div>';
}

function buildGoalsSection(){
  const now=new Date();
  let h='<div class="sv-goals-section"><div class="sv-section-header"><div class="sv-section-title">🎯 存款目标 <span class="sv-section-count">'+savings.goals.length+'</span></div><button class="btn-outline" onclick="openModal(\'savings\')">+ 添加</button></div><div class="sv-goals-grid">';
  savings.goals.forEach((g,i)=>{
    const rem=g.target-g.current;
    const p=g.target>0?Math.min(100,Math.round(g.current/g.target*100)):0;
    const dl=g.deadline?new Date(g.deadline+'-01'):null;
    const ml=dl?Math.max(1,Math.ceil((dl-now)/2592e5)):99;
    const mp=rem>0?Math.ceil(rem/ml):0;
    const isComplete=p>=100||rem<=0;
    const urgent=ml<=3&&!isComplete;
    const statusText=isComplete?'已完成':urgent?'临近期限':'进行中';
    const statusBg=isComplete?'var(--green)':urgent?'rgba(239,107,107,.1)':'rgba(16,185,129,.1)';
    const statusColor=isComplete?'#080d0a':urgent?'var(--red)':'var(--accent)';

    // Timeline
    const segs=Math.min(dl?Math.max(1,Math.ceil((dl-new Date(g.created||'2026-01-01'))/2592e5)):8,12);
    const elapsed=Math.min(segs,segs-ml);

    h+='<div class="sv-goal" style="animation-delay:'+(i*.08+.2)+'s">';
    h+='<div class="sv-goal-accent" style="background:'+g.color+'"></div>';
    h+='<div class="sv-goal-top">';
    h+='<div class="sv-goal-row"><div class="sv-goal-icon" style="background:'+g.color+'18">'+g.icon+'</div><div style="flex:1"><div class="sv-goal-name">'+g.name+'</div><div class="sv-goal-deadline">'+(g.deadline||'无期限')+(ml<99?' · 剩余'+ml+'个月':'')+'</div></div><div class="sv-goal-status" style="background:'+statusBg+';color:'+statusColor+(isComplete?';background:var(--green)':'')+'">'+statusText+'</div></div>';
    h+='<div class="sv-goal-amounts"><div class="sv-goal-amounts-val" style="color:'+g.color+'">'+fmt(g.current)+'</div><div><span class="sv-goal-amounts-target">/ '+fmt(g.target)+'</span> <span style="font-size:.65rem;color:var(--text-dim);font-family:var(--font-mono)">('+p+'%)</span></div></div>';
    h+='<div class="sv-goal-bar-wrap"><div class="sv-goal-bar-fill" style="width:'+p+'%;background:'+g.color+'"></div></div>';

    // Timeline dots
    h+='<div class="sv-goal-timeline">';
    for(let j=0;j<segs;j++){
      const done=j<elapsed;
      const isCurrent=j===elapsed&&!isComplete;
      h+='<div class="sv-goal-tl-dot'+(isCurrent?' active':'')+'" style="background:'+(done?g.color:isCurrent?g.color:'var(--surface-3)')+';color:'+g.color+'"></div>';
      if(j<segs-1)h+='<div class="sv-goal-tl-line" style="background:'+(done?g.color:'var(--border)')+'"></div>';
    }
    h+='<div class="sv-goal-tl-label">'+elapsed+'/'+segs+'</div>';
    h+='</div></div>';

    h+='<div class="sv-goal-bottom"><div class="sv-goal-monthly">每月需存 <strong>'+fmt(mp)+'</strong>'+(ml<99?' · '+ml+'个月':'')+'</div><div class="sv-goal-btns"><button class="sv-goal-btn primary" onclick="openRecordModal('+g.id+')">💳 存入</button><button class="sv-goal-btn danger" onclick="deleteSavingsGoal('+g.id+')">删除</button></div></div>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}

// Monthly view
function renderMonthlyView(c){generateAll(false);const now=new Date();let h='<div class="main-header"><div class="main-title">📅 月度规划</div><div class="main-filters"><button class="btn-outline" onclick="openModal(\'config\')">⚙️</button><button class="btn-smart" onclick="regenerateAll()">🤖 重新生成</button></div></div>';h+='<div class="smart-summary"><div class="smart-summary-card"><div class="smart-summary-val" style="color:var(--accent)">'+goals.filter(g=>!g.completed).length+'</div><div class="smart-summary-label">进行中</div></div><div class="smart-summary-card"><div class="smart-summary-val" style="color:var(--green)">'+goals.filter(g=>g.completed).length+'</div><div class="smart-summary-label">已完成</div></div><div class="smart-summary-card"><div class="smart-summary-val" style="color:var(--gold)">'+fmt(planConfig.monthlyIncome-planConfig.fixedExpenses)+'</div><div class="smart-summary-label">月结余</div></div></div>';h+='<div class="monthly-grid">';for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const plan=monthlyPlans[key]||{locked:false,notes:'',tasks:[]};const tasks=plan.tasks||[];const dc=tasks.filter(t=>t.done).length;const pct=tasks.length?Math.round(dc/tasks.length*100):0;const extra=getME(key);const inc=getMI(key);h+='<div class="month-card'+(i===0?' current':'')+(plan.locked?' locked':'')+'" style="animation-delay:'+i*.07+'s"><div class="month-card-head"><div style="display:flex;align-items:center;gap:8px"><div class="month-card-name">'+d.getFullYear()+' '+MN[d.getMonth()]+'</div>'+(i===0?'<span class="month-badge" style="background:var(--accent-glow);color:var(--accent)">本月</span>':'')+(plan.locked?'<span class="month-badge" style="background:rgba(167,139,250,.1);color:var(--purple)">🔒</span>':'')+'</div><button class="month-lock-btn'+(plan.locked?' on':'')+'" onclick="toggleMonthLock(\''+key+'\')">'+(plan.locked?'🔒':'🔓')+'</button></div><div class="month-card-body">';if(!tasks.length)h+='<div style="padding:14px 0;text-align:center;font-size:.75rem;color:var(--text-dim)">暂无</div>';tasks.forEach((t,j)=>{const tt=t.type==='saving'?{bg:'rgba(245,158,11,.1)',color:'var(--gold)',text:'💰'}:{bg:(t.color||'var(--accent)')+'18',color:t.color||'var(--accent)',text:'🎯'};h+='<div class="month-task"><div class="month-task-check'+(t.done?' done':'')+'" onclick="togglePlanTask(\''+key+'\','+j+')"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#080d0a" stroke-width="3"><polyline points="4 12 9 17 20 6"/></svg></div><div class="month-task-content"><div class="month-task-title" onclick="openEditTask(\''+key+'\','+j+')">'+t.title+'</div><div class="month-task-meta"><span class="month-task-tag" style="background:'+tt.bg+';color:'+tt.color+'">'+tt.text+'</span><span class="month-task-val" onclick="openEditTask(\''+key+'\','+j+')">'+(t.type==='saving'?fmt(t.amount):(t.pct||0)+'%')+'</span></div></div><button class="month-task-del" onclick="deletePlanTask(\''+key+'\','+j+')">✕</button></div>'});h+='</div><button class="month-add-btn" onclick="openAddTask(\''+key+'\')">+ 添加</button><div class="month-notes"><textarea placeholder="备注" onblur="savePlanNotes(\''+key+'\',this.value)">'+(plan.notes||'')+'</textarea></div><div class="month-card-foot"><span>'+fmt(inc)+' · '+tasks.length+'项</span><span>'+pct+'%</span></div></div>'}h+='</div>';c.innerHTML=h}

// All action functions
function openEditTask(key,idx){const plan=monthlyPlans[key];if(!plan?.tasks?.[idx])return;const t=plan.tasks[idx];editTaskCtx={key,idx};$('editTaskTitle').textContent=t.type==='saving'?'编辑存款':'编辑目标';$('editName').value=t.title;const vs=$('editValueSection'),presets=$('editPresets');if(t.type==='saving'){$('editValueLabel').textContent='金额';$('editValue').value=t.amount||0;$('editValUnit').textContent='¥';presets.innerHTML=presetHTML([500,1000,2000,5000]);vs.style.display=''}else{$('editValueLabel').textContent='百分比';$('editValue').value=t.pct||0;$('editValUnit').textContent='%';presets.innerHTML=presetHTML([5,10,15,20]);vs.style.display=''}$('editTaskModal').classList.add('show');setTimeout(()=>$('editName').focus(),100)}
function presetHTML(vals){return vals.map(v=>'<span class="quick-preset" onclick="setVal(\'editValue\','+v+')">'+v+'</span>').join('')}
function saveEditTask(){if(!editTaskCtx)return;const{key,idx}=editTaskCtx;const plan=monthlyPlans[key];if(!plan?.tasks?.[idx])return;const t=plan.tasks[idx];const n=$('editName').value.trim();if(!n){toast('名称不能为空','error');return}t.title=n;if(t.type==='saving')t.amount=Math.max(0,parseInt($('editValue').value)||0);else t.pct=Math.max(0,Math.min(100,parseInt($('editValue').value)||0));t.auto=false;saveAll();closeModal(null,'editTaskModal');toast('已更新');render()}
function openAddTask(key){addTaskTargetKey=key;$('addTaskName').value='';$('addValue').value='';selectAddType(document.querySelector('.add-type-card[data-type="goal"]'));$('addTaskModal').classList.add('show');setTimeout(()=>$('addTaskName').focus(),100)}
function selectAddType(el){document.querySelectorAll('#addTypeCards .add-type-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');const type=el.dataset.type;const vs=$('addValueSection'),presets=$('addPresets');if(type==='saving'){$('addValueLabel').textContent='金额';$('addValUnit').textContent='¥';presets.innerHTML='<span class="quick-preset" onclick="setVal(\'addValue\',500)">500</span><span class="quick-preset" onclick="setVal(\'addValue\',1000)">1000</span><span class="quick-preset" onclick="setVal(\'addValue\',5000)">5000</span>';vs.style.display=''}else if(type==='habit'){vs.style.display='none'}else{$('addValueLabel').textContent='百分比';$('addValUnit').textContent='%';presets.innerHTML='<span class="quick-preset" onclick="setVal(\'addValue\',5)">5%</span><span class="quick-preset" onclick="setVal(\'addValue\',10)">10%</span>';vs.style.display=''}}
function saveAddTask(){const name=$('addTaskName').value.trim();if(!name){toast('请输入名称','error');return}const type=document.querySelector('#addTypeCards .add-type-card.selected')?.dataset.type||'goal';if(!monthlyPlans[addTaskTargetKey])monthlyPlans[addTaskTargetKey]={locked:false,notes:'',tasks:[]};monthlyPlans[addTaskTargetKey].tasks.push({id:'c_'+Date.now(),type,title:name,pct:type==='goal'?parseInt($('addValue').value)||5:0,amount:type==='saving'?parseInt($('addValue').value)||0:0,done:false,auto:false,color:'var(--purple)',icon:type==='saving'?'💰':'✨'});saveAll();closeModal(null,'addTaskModal');toast('已添加');render()}
function toggleMonthLock(k){if(!monthlyPlans[k])monthlyPlans[k]={locked:false,notes:'',tasks:[]};monthlyPlans[k].locked=!monthlyPlans[k].locked;saveAll();toast(monthlyPlans[k].locked?'已锁定':'已解锁','info');render()}
function togglePlanTask(k,i){const p=monthlyPlans[k];if(!p?.tasks?.[i])return;p.tasks[i].done=!p.tasks[i].done;saveAll();render()}
function deletePlanTask(k,i){showConfirm('删除任务','确定？',()=>{const p=monthlyPlans[k];if(p?.tasks)p.tasks.splice(i,1);saveAll();toast('已删除');render()})}
function savePlanNotes(k,v){if(!monthlyPlans[k])monthlyPlans[k]={locked:false,notes:'',tasks:[]};monthlyPlans[k].notes=v;saveAll()}
function regenerateAll(){showConfirm('重新生成','覆盖未锁定月份',()=>{Object.keys(monthlyPlans).forEach(k=>{if(!monthlyPlans[k].locked)delete monthlyPlans[k]});generateAll(true);toast('已重新生成');render()})}
function openPlanConfig(){$('cfgIncome').value=planConfig.monthlyIncome;$('cfgFixed').value=planConfig.fixedExpenses;$('cfgSaveRate').value=planConfig.saveRate;const io=$('cfgIncomeOverrides');io.innerHTML='';Object.entries(planConfig.incomeOverrides).forEach(([m,v])=>{io.innerHTML+='<div class="config-income-row"><span style="width:48px;font-size:.75rem;color:var(--text-mid);font-family:var(--font-mono)">'+m+'月</span><input class="config-income-input" type="number" value="'+v+'" data-month="'+m+'" onchange="planConfig.incomeOverrides[parseInt(this.dataset.month)]=parseInt(this.value)||0"><button class="expense-del" onclick="delete planConfig.incomeOverrides['+m+'];openPlanConfig()">✕</button></div>'});const ex=$('cfgExpenses');ex.innerHTML='';planConfig.futureExpenses.forEach((e,i)=>{ex.innerHTML+='<div class="expense-row"><input type="month" value="'+e.month+'" class="exp-m" style="width:130px"><input type="text" value="'+e.name+'" class="exp-n" style="flex:1"><input type="number" value="'+e.amount+'" class="exp-a" style="width:90px"><button class="expense-del" onclick="planConfig.futureExpenses.splice('+i+',1);openPlanConfig()">✕</button></div>'})}
function addIncomeOverride(){const m=prompt('月份(1-12):');if(!m)return;const v=prompt('收入:',planConfig.monthlyIncome);if(!v)return;planConfig.incomeOverrides[parseInt(m)]=parseInt(v);openPlanConfig()}
function addCfgExpense(){planConfig.futureExpenses.push({month:'',name:'',amount:0});openPlanConfig()}
function savePlanConfig(){planConfig.monthlyIncome=parseInt($('cfgIncome').value)||0;planConfig.fixedExpenses=parseInt($('cfgFixed').value)||0;planConfig.saveRate=parseInt($('cfgSaveRate').value)||50;document.querySelectorAll('.exp-m').forEach((el,i)=>{if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].month=el.value});document.querySelectorAll('.exp-n').forEach((el,i)=>{if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].name=el.value});document.querySelectorAll('.exp-a').forEach((el,i)=>{if(planConfig.futureExpenses[i])planConfig.futureExpenses[i].amount=parseInt(el.value)||0});saveAll();Object.keys(monthlyPlans).forEach(k=>{if(!monthlyPlans[k]?.locked)delete monthlyPlans[k]});generateAll(true);closeModal(null,'configModal');toast('已保存');render()}
function toggleGoal(id){const g=goals.find(x=>x.id===id);if(!g)return;g.completed=!g.completed;g.progress=g.completed?100:Math.min(g.progress,95);if(g.completed&&g.subtasks)g.subtasks.forEach(s=>s.d=true);saveAll();toast(g.completed?'已完成 🎉':'已重新开始');render()}
function deleteGoal(id){showConfirm('删除目标','确定？',()=>{goals=goals.filter(g=>g.id!==id);saveAll();toast('已删除');render()})}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderMain()}
function openModal(t){$(t==='goal'?'goalModal':t==='savings'?'savingsModal':t==='record'?'recordModal':'configModal').classList.add('show');if(t==='config')openPlanConfig()}
function closeModal(e,id){if(e&&e.target!==e.currentTarget)return;$(id).classList.remove('show')}
function addGoal(){const t=$('goalTitle').value.trim();if(!t){toast('请输入名称','error');return}goals.unshift({id:Date.now(),title:t,desc:$('goalDesc').value.trim(),category:$('goalCategory').value,priority:selectedPriority,deadline:$('goalDeadline').value,progress:0,completed:false,created:new Date().toISOString().slice(0,10),subtasks:[]});saveAll();closeModal(null,'goalModal');toast('已创建');render()}
function addSavingsGoal(){const n=$('svName').value.trim(),t=parseInt($('svTarget').value);if(!n||!t){toast('请填写','error');return}const cs=['#10b981','#34d399','#60a5fa','#f472b6','#a78bfa','#2dd4bf'];savings.goals.push({id:Date.now(),name:n,icon:$('svIcon').value,target:t,current:parseInt($('svCurrent').value)||0,deadline:$('svDeadline').value,color:cs[savings.goals.length%cs.length]});saveAll();closeModal(null,'savingsModal');toast('已添加');render()}
function deleteSavingsGoal(id){showConfirm('删除','确定？',()=>{savings.goals=savings.goals.filter(g=>g.id!==id);saveAll();toast('已删除');render()})}
function openRecordModal(gid){pendingRecordGoalId=gid;$('recordAmount').value='';openModal('record')}
function confirmRecord(){const a=parseInt($('recordAmount').value);if(!a||a<=0){toast('请输入金额','error');return}const g=savings.goals.find(x=>x.id===pendingRecordGoalId);if(g)g.current=Math.min(g.target,g.current+a);const now=new Date(),mk=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');if(!monthlyRecords[mk])monthlyRecords[mk]={saved:0,target:Math.round((planConfig.monthlyIncome-planConfig.fixedExpenses)*planConfig.saveRate/100)};monthlyRecords[mk].saved+=a;saveAll();closeModal(null,'recordModal');toast('已存入 '+fmt(a));render()}

// Init
(function(){const now=new Date(),days=['日','一','二','三','四','五','六'];$('headerDate').textContent=now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0')+' 周'+days[now.getDay()];syncCfg();generateAll(false);render()})();
</script>
</body>
